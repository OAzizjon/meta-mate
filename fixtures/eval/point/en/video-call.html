<style>
*{box-sizing:border-box;margin:0;padding:0}
html, body { margin:0; width:1280px; height:800px; overflow:hidden }
body{font:13px "Segoe UI",Tahoma,Arial,sans-serif;color:#eceef2;background:#1b1d22}

svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.c{display:flex;align-items:center;justify-content:center}
.wc{width:46px;height:32px;color:#ccc}

.ib{border-radius:6px;color:#e6e8ee}

.av{width:120px;height:120px;border-radius:50%;font-size:44px;font-weight:600;color:#fff}
.tag{display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:6px;background:rgba(0,0,0,.55);font-size:12px}
.cb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:8px;font-size:11px;color:#e6e8ee}
.leave{background:#d93a3a;color:#fff;border-radius:8px;gap:8px;font-weight:600;font-size:14px}
.badge{position:absolute;right:20px;top:6px;min-width:16px;height:16px;border-radius:8px;background:#4b5160;font-size:10px;line-height:16px;text-align:center}
</style>
</head>
