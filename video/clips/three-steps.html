<!doctype html>
<html lang="en">
<head>
<meta name="clip" content="duration=7.0;fps=60;width=1920;height=1080;alpha=0">
<meta charset="utf-8">
<title>three-steps</title>
<link rel="stylesheet" href="_kit.css">
<style>
  /* Three steps, 7.0 s: how it works, three comic panels appearing left to right (each 2 s):
     1 (0-2 s) "Ask out loud" (Ctrl keycap pressed + bottom voice bar with live words
     "how do I make text bigger?");
     2 (2-4 s) "Mate lights the button" (Mate with arm 'point', beam to a big button in a mini
     Settings window, glowing ring);
     3 (4-6 s) "You click it" (hand cursor clicks it, NICE! burst).
     Panel numbers in comic circles. Hold all three for the last second (6-7 s). */
  .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
  .full { position: absolute; inset: 0; }
  .bleed { position: absolute; inset: -24px; }

  .warm {
    background: radial-gradient(circle at 960px 540px, #fff8e2 0%, #fcf7ea 58%, #efe1c4 100%);
  }
  .dots {
    --dot: rgb(31 42 68 / 0.11);
    -webkit-mask-image: radial-gradient(circle at 960px 540px, transparent 22%, #000 80%);
    mask-image: radial-gradient(circle at 960px 540px, transparent 22%, #000 80%);
  }

  /* Three comic panels left to right. */
  .step-panel {
    position: absolute; top: 96px; width: 572px; height: 904px;
    box-sizing: border-box; background: var(--white);
    border: 6px solid var(--ink); border-radius: 28px;
    box-shadow: 12px 12px 0 var(--ink);
    animation: panel-in 0.38s var(--pop) var(--pt) both;
  }
  .p1 { left: 52px; --pt: 0.08s; }
  .p2 { left: 674px; --pt: 2.0s; }
  .p3 { left: 1296px; --pt: 4.0s; }

  /* Panel numbers in comic circles. */
  .num-circle {
    position: absolute; left: -24px; top: -36px; width: 92px; height: 92px;
    border-radius: 50%; background: var(--bulb); border: 6px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 64px; line-height: 1; color: var(--ink); z-index: 4;
    animation: pop-in 0.34s var(--pop) calc(var(--pt) + 0.12s) both;
  }

  /* Panel headlines (>= 64 px, <= 6 words per line). */
  .step-head {
    position: absolute; left: 20px; right: 20px; top: 34px;
    text-align: center; font-size: 64px; line-height: 1.08;
    color: var(--white); -webkit-text-stroke: 9px var(--ink);
    filter: drop-shadow(5px 5px 0 var(--ink));
    animation: slam 0.3s var(--snap) calc(var(--pt) + 0.2s) both;
  }

  .step-stage {
    position: absolute; left: 24px; right: 24px; top: 196px; bottom: 24px;
    border: 4px solid var(--ink); border-radius: 20px;
    overflow: hidden; background: #f8f4e8;
  }

  /* --- PANEL 1: Ask out loud --- */
  .ctrl-wrap {
    position: absolute; left: 152px; top: 82px; width: 220px; height: 190px;
  }
  .ctrl-ring {
    position: absolute; inset: -24px; border-radius: 42px;
    border: 6px dashed var(--bulb);
    animation: fade-in 0.25s ease-out 0.65s both;
  }
  .ctrl-key {
    position: absolute; inset: 0; border-radius: 28px;
    background: linear-gradient(180deg, #ffffff 0%, #e7e2d5 100%);
    border: 6px solid var(--ink);
    box-shadow: 0 18px 0 var(--ink), 10px 18px 0 var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 68px; line-height: 1; color: var(--ink);
    animation: key-press 0.45s var(--snap) 0.58s both;
  }
  .ctrl-sub {
    margin-top: 8px; font-size: 26px; padding: 2px 14px; border-radius: 10px;
    background: var(--bulb); border: 3px solid var(--ink);
  }

  /* Soundwave bars above the bottom voice bar. */
  .wave-row {
    position: absolute; left: 0; right: 0; top: 334px; height: 70px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    animation: fade-in 0.2s ease-out 0.8s both;
  }
  .wave-bar {
    width: 14px; height: 48px; border-radius: 7px; background: var(--bulb);
    border: 3px solid var(--ink);
    animation: bar-pulse 0.4s ease-in-out var(--bt) 2 alternate both;
  }

  /* Bottom voice bar with live words "how do I make text bigger?". */
  .voice-bar {
    position: absolute; left: 18px; right: 18px; bottom: 22px; height: 220px;
    background: var(--ink); border: 5px solid var(--ink); border-radius: 22px;
    box-shadow: 8px 8px 0 rgb(31 42 68 / 0.28);
    padding: 20px 24px; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: center;
    animation: bar-up 0.34s var(--pop) 0.72s both;
  }
  .voice-tag {
    display: inline-flex; align-items: center; gap: 10px;
    color: var(--bulb); font-size: 28px; margin-bottom: 10px;
  }
  .voice-dot {
    width: 18px; height: 18px; border-radius: 50%; background: var(--bulb);
    box-shadow: 0 0 14px var(--bulb);
  }
  .voice-words {
    font-size: 44px; line-height: 1.22; color: var(--white);
  }
  .voice-words .lw {
    display: inline-block;
    animation: word-pop 0.22s var(--pop) var(--wt) both;
  }

  /* --- PANEL 2: Mate lights the button --- */
  .p2-stage { background: radial-gradient(circle at 140px 470px, #fff3c4 0%, #f7f2e4 70%); }
  .mini-win {
    position: absolute; left: 158px; top: 36px; width: 342px; height: 360px;
    background: var(--white); border: 5px solid var(--ink); border-radius: 18px;
    box-shadow: 8px 8px 0 var(--ink); overflow: hidden;
  }
  .mini-bar {
    height: 44px; background: #dce5ef; border-bottom: 4px solid var(--ink);
    display: flex; align-items: center; padding: 0 14px; gap: 10px;
    font-size: 26px; color: var(--ink);
  }
  .mini-dot { width: 14px; height: 14px; border-radius: 50%; background: #ff9b85; border: 3px solid var(--ink); }
  .mini-body { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
  .mini-sample {
    padding: 14px 18px; border: 3.5px solid var(--ink); border-radius: 12px;
    background: #fcf9f1; font-size: 32px; color: var(--ink); text-align: center;
  }
  .big-btn {
    position: relative; height: 118px; border: 6px solid var(--ink); border-radius: 59px;
    background: linear-gradient(180deg, #6d9cc4 0%, #3b6688 100%);
    box-shadow: 8px 8px 0 var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 46px; color: var(--white); text-shadow: 4px 4px 0 var(--ink);
  }

  .mate-p2 {
    position: absolute; left: -12px; top: 356px; width: 290px; height: 268px; z-index: 3;
  }
  .layer { position: absolute; inset: 0; transform-origin: 42.3% 86.7%; }
  .mate-p2 svg { display: block; }
  .m2-pop { animation: pop-in 0.34s var(--pop) 2.25s both; }
  #mate-p2-a { animation: fade-out 0.08s linear 2.68s both; }
  #mate-p2-b { animation: fade-in 0.08s linear 2.62s both; }

  .p2-beam {
    position: absolute; left: 214px; top: 368px; width: 260px; height: 150px;
    transform-origin: 0 50%; z-index: 2;
    filter: drop-shadow(0 0 14px rgb(255 236 150 / 0.95));
    animation: p2-beam-in 0.42s var(--snap) 2.66s both;
  }
  .p2-beam i {
    position: absolute; inset: 0;
    clip-path: polygon(0 45%, 100% 0, 100% 100%, 0 55%);
    background: linear-gradient(90deg, rgb(255 252 225 / 0.96), rgb(255 224 112 / 0.55));
  }

  .glow-ring {
    position: absolute; left: 164px; top: 186px; width: 330px; height: 146px;
    box-sizing: border-box; border: 10px solid #fff3b0; border-radius: 73px;
    box-shadow: 0 0 0 5px var(--ink), inset 0 0 0 5px var(--ink), 0 0 44px 18px rgb(255 225 110 / 0.9);
    z-index: 3; pointer-events: none;
  }
  .p2-ring { animation: ring-pop 0.3s var(--pop) 2.95s both; }

  /* --- PANEL 3: You click it --- */
  .p3-stage { background: radial-gradient(circle at 260px 300px, #fff5ca 0%, #f7f2e4 72%); }
  .p3-win { left: 92px; top: 210px; width: 342px; height: 380px; }
  .p3-sample {
    animation: text-grow 0.36s var(--pop) 4.92s both;
  }
  .p3-btn {
    transform-origin: 50% 100%;
    animation: btn-press 0.38s linear 4.82s both;
  }
  .p3-ring {
    left: 98px; top: 360px;
    animation: fade-in 0.25s ease-out 4.15s both;
  }

  /* Hand cursor clicking the button in Panel 3. */
  .p3-cursor {
    position: absolute; left: 300px; top: 446px; width: 92px; height: 112px; z-index: 5;
    filter: drop-shadow(6px 6px 0 var(--ink));
    animation: cursor-arrive 0.4s var(--snap) 4.42s both;
  }
  .p3-cursor-press {
    position: absolute; inset: 0; transform-origin: 24px 10px;
    animation: cursor-tap 0.26s ease-in-out 4.8s both;
  }
  .p3-cursor svg { display: block; width: 92px; height: 112px; }

  /* NICE! comic burst in Panel 3. */
  .nice-burst {
    position: absolute; left: 108px; top: 14px; width: 350px; height: 210px;
    rotate: -5deg; z-index: 6;
    animation: pop-in 0.34s var(--pop) 4.94s both;
  }
  .nice-burst .burst { position: absolute; inset: 0; }
  .nice-burst .b-shadow { background: var(--ink); translate: 10px 10px; }
  .nice-burst .b-ink { background: var(--ink); }
  .nice-burst .b-fill { inset: 9px; background: var(--bulb); }
  .nice-text {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 76px; line-height: 1; color: var(--white);
    -webkit-text-stroke: 9px var(--ink); filter: drop-shadow(5px 5px 0 var(--ink));
    rotate: -4deg;
  }

  .shake-p3 { animation: shake 0.22s linear 4.96s both; }

  @keyframes panel-in {
    0% { opacity: 0; transform: translateY(48px) scale(0.9); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes key-press {
    0% { transform: translateY(0); }
    45% { transform: translateY(14px); background: #fff0b8; box-shadow: 0 4px 0 var(--ink), 4px 4px 0 var(--ink); }
    100% { transform: translateY(12px); background: #fff0b8; box-shadow: 0 6px 0 var(--ink), 5px 6px 0 var(--ink); }
  }
  @keyframes bar-pulse {
    from { transform: scaleY(0.35); }
    to { transform: scaleY(1); }
  }
  @keyframes bar-up {
    from { opacity: 0; transform: translateY(40px) scale(0.94); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes word-pop {
    from { opacity: 0; transform: translateY(14px) scale(0.85); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes p2-beam-in {
    0% { opacity: 0; transform: rotate(-28deg) scaleX(0.2); }
    100% { opacity: 1; transform: rotate(-28deg) scaleX(1); }
  }
  @keyframes ring-pop {
    0% { opacity: 0; transform: scale(1.38); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes cursor-arrive {
    0% { opacity: 0; transform: translate(180px, 190px) rotate(16deg); }
    100% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes cursor-tap {
    0%, 100% { transform: scale(1); }
    45% { transform: scale(0.82) translate(-4px, 6px); }
  }
  @keyframes btn-press {
    0%, 100% { transform: scale(1, 1); }
    35% { transform: translateY(6px) scale(1.05, 0.84); }
    70% { transform: translateY(-6px) scale(0.97, 1.06); }
  }
  @keyframes text-grow {
    0% { transform: scale(1); background: #fcf9f1; }
    60% { transform: scale(1.16); background: #fff0b3; }
    100% { transform: scale(1.12); background: #fff0b3; }
  }
</style>
</head>
<body>
<script>if (location.search.includes('render=1')) document.documentElement.classList.add('render');</script>
<div class="scene">
  <div class="shake-p3 full">
    <div class="warm bleed"></div>
    <div class="dots halftone bleed"></div>

    <!-- PANEL 1: Ask out loud (0-2 s) -->
    <div class="step-panel p1">
      <div class="num-circle comic">1</div>
      <div class="step-head shout">Ask out loud</div>
      <div class="step-stage">
        <div class="ctrl-wrap">
          <div class="ctrl-ring"></div>
          <div class="ctrl-key comic">
            Ctrl
            <span class="ctrl-sub">HOLD</span>
          </div>
        </div>
        <div class="wave-row">
          <div class="wave-bar" style="--bt: 0.82s"></div>
          <div class="wave-bar" style="--bt: 0.90s"></div>
          <div class="wave-bar" style="--bt: 0.86s"></div>
          <div class="wave-bar" style="--bt: 0.94s"></div>
          <div class="wave-bar" style="--bt: 0.84s"></div>
          <div class="wave-bar" style="--bt: 0.92s"></div>
          <div class="wave-bar" style="--bt: 0.88s"></div>
        </div>
        <div class="voice-bar">
          <div class="voice-tag comic"><span class="voice-dot"></span> Listening&hellip;</div>
          <div class="voice-words comic">
            <span class="lw" style="--wt: 0.92s">&ldquo;how</span>
            <span class="lw" style="--wt: 1.06s">do</span>
            <span class="lw" style="--wt: 1.18s">I</span>
            <span class="lw" style="--wt: 1.30s">make</span><br>
            <span class="lw" style="--wt: 1.44s">text</span>
            <span class="lw" style="--wt: 1.58s">bigger?&rdquo;</span>
          </div>
        </div>
      </div>
    </div>

    <!-- PANEL 2: Mate lights the button (2-4 s) -->
    <div class="step-panel p2">
      <div class="num-circle comic">2</div>
      <div class="step-head shout">Mate lights<br>the button</div>
      <div class="step-stage p2-stage">
        <div class="mini-win">
          <div class="mini-bar comic"><span class="mini-dot"></span> Settings</div>
          <div class="mini-body">
            <div class="mini-sample comic">Sample Aa</div>
            <div class="big-btn comic">Text size +</div>
          </div>
        </div>
        <div class="p2-beam"><i></i></div>
        <div class="glow-ring p2-ring"></div>
        <div class="mate-p2">
          <div class="layer m2-pop">
            <div class="layer" id="mate-p2-a"></div>
            <div class="layer" id="mate-p2-b"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- PANEL 3: You click it (4-6 s, hold 6-7 s) -->
    <div class="step-panel p3">
      <div class="num-circle comic">3</div>
      <div class="step-head shout">You click it</div>
      <div class="step-stage p3-stage">
        <div class="nice-burst">
          <div class="burst b-shadow"></div>
          <div class="burst b-ink"></div>
          <div class="burst b-fill"></div>
          <div class="nice-text shout">NICE!</div>
        </div>

        <div class="mini-win p3-win">
          <div class="mini-bar comic"><span class="mini-dot"></span> Settings</div>
          <div class="mini-body">
            <div class="mini-sample p3-sample comic">Sample Aa</div>
            <div class="big-btn p3-btn comic">Text size +</div>
          </div>
        </div>
        <div class="glow-ring p3-ring"></div>

        <div class="p3-cursor">
          <div class="p3-cursor-press">
            <svg viewBox="0 0 90 110">
              <path d="M28 10 C28 4 40 4 40 10 V46 C44 43 52 44 54 50 C59 48 66 50 68 56 C73 55 78 59 78 66 V82 C78 96 65 104 46 104 H34 C22 104 14 92 10 78 L6 62 C4 55 12 50 18 54 L28 62 Z" fill="#ffffff" stroke="#1f2a44" stroke-width="6" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../../assets/art/src/mate-lib.js"></script>
<script>
  document.getElementById('mate-p2-a').innerHTML = mate({ eyes: 'open', mouth: 'smile', arm: 'none', glow: true, size: 290 });
  document.getElementById('mate-p2-b').innerHTML = mate({ eyes: 'happy', mouth: 'grin', arm: 'point', glow: true, size: 290 });
</script>
</body>
</html>
