<!doctype html>
<html lang="en">
<head>
<meta name="clip" content="duration=4.0;fps=60;width=1920;height=1080;alpha=0">
<meta charset="utf-8">
<title>meet-mate</title>
<link rel="stylesheet" href="_kit.css">
<style>
  /* Meet Mate, 4.0 s: the answer. A soft spotlight opens on dark paper; Mate drops in from the
     top with a bounce and landing squash, waves (stacked drawings cross-faded with a friendly
     wave rock), and a name card slams in: "Meet Mate." and under it "A little light for the
     right button." Holds on the final frame. */
  body { background: #182238; }
  .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #182238; }
  .full { position: absolute; inset: 0; }
  .bleed { position: absolute; inset: -24px; }

  .dark-paper {
    background: radial-gradient(circle at 520px 560px, #2b3c5e 0%, #1c2841 55%, #121a2b 100%);
  }
  .dots {
    --dot: rgb(255 244 207 / 0.08);
    -webkit-mask-image: radial-gradient(circle at 520px 560px, transparent 15%, #000 75%);
    mask-image: radial-gradient(circle at 520px 560px, transparent 15%, #000 75%);
  }

  /* Soft spotlight cone + floor pool opening on dark paper (0-0.45 s). */
  .spot-wrap {
    position: absolute; inset: 0;
    animation: spot-open 0.45s var(--snap) 0.04s both;
    transform-origin: 500px 0px;
  }
  .spot-cone {
    position: absolute; left: 80px; top: -60px; width: 840px; height: 1060px;
    clip-path: polygon(38% 0%, 62% 0%, 100% 100%, 0% 100%);
    background: linear-gradient(180deg, rgb(255 244 200 / 0.42) 0%, rgb(255 218 106 / 0.24) 60%, rgb(255 205 60 / 0) 100%);
  }
  .spot-floor {
    position: absolute; left: 170px; top: 790px; width: 660px; height: 170px; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgb(255 236 158 / 0.72) 0%, rgb(255 205 60 / 0.32) 52%, rgb(255 205 60 / 0) 76%);
  }
  .spot-rays {
    position: absolute; left: 60px; top: 130px; width: 880px; height: 880px;
    animation: fade-in 0.4s ease-out 0.35s both;
  }
  .spot-rays .rays { position: absolute; inset: 0; animation: spin 16s linear 0s infinite both; }

  /* Mate (560 px wide; base at 42.3% 86.7%). Drops from top with squash on landing, then waves. */
  .mate { position: absolute; left: 260px; top: 380px; width: 560px; height: 517px; }
  .layer { position: absolute; inset: 0; transform-origin: 42.3% 86.7%; }
  .mate svg { display: block; }
  .m-drop { animation: mate-drop 0.62s linear 0.22s both; }
  .m-wave { animation: mate-wave 0.9s ease-in-out 0.92s both; }
  #mate-land { animation: fade-out 0.08s linear 0.92s both; }
  #mate-wave-a { animation: fade-in 0.08s linear 0.88s both, fade-out 0.08s linear 1.28s forwards; }
  #mate-wave-b { animation: fade-in 0.08s linear 1.24s both; }

  /* Comic wave arcs near Mate's raised hand. */
  .wave-lines {
    position: absolute; left: 665px; top: 430px; width: 110px; height: 110px;
    animation: wave-pop 0.9s ease-in-out 0.92s both;
  }
  .wave-lines svg { width: 100%; height: 100%; overflow: visible; }

  /* Name card on the right: "Meet Mate." and "A little light for the right button." */
  .card-wrap {
    position: absolute; left: 850px; top: 250px; width: 970px;
    animation: slam 0.34s var(--snap) 1.45s both;
  }
  .name-card {
    padding: 44px 54px 52px; background: var(--paper);
    border: 7px solid var(--ink); border-radius: 32px;
    box-shadow: 16px 16px 0 var(--ink); rotate: -1.2deg;
  }
  .meet-title {
    font-size: 148px; line-height: 1.05; color: var(--bulb);
    -webkit-text-stroke: 13px var(--ink); filter: drop-shadow(8px 8px 0 var(--ink));
    white-space: nowrap; margin-bottom: 24px;
  }
  .meet-sub {
    font-size: 68px; line-height: 1.22; color: var(--ink);
    animation: sub-in 0.34s var(--pop) 1.88s both;
  }
  .meet-sub .hl {
    display: inline-block; padding: 0 16px 4px; background: var(--bulb);
    border: 4px solid var(--ink); border-radius: 14px; box-shadow: 5px 5px 0 var(--ink);
  }

  .shake-land { animation: shake 0.2s linear 0.48s both; }
  .shake-card { animation: shake 0.22s linear 1.62s both; }

  @keyframes spot-open {
    0% { opacity: 0; transform: scaleX(0.15); }
    60% { opacity: 1; transform: scaleX(1.06); }
    100% { opacity: 1; transform: scaleX(1); }
  }
  /* Drop from top stretched, squash at contact (~0.48 s), bounce and settle. */
  @keyframes mate-drop {
    0% { transform: translateY(-920px) scale(0.82, 1.32); animation-timing-function: cubic-bezier(0.55, 0, 0.9, 0.45); }
    42% { transform: translateY(0) scale(1.32, 0.72); animation-timing-function: cubic-bezier(0.2, 0.85, 0.35, 1); }
    66% { transform: translateY(-68px) scale(0.92, 1.12); animation-timing-function: cubic-bezier(0.5, 0, 0.85, 0.5); }
    84% { transform: translateY(0) scale(1.1, 0.9); animation-timing-function: ease-out; }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes mate-wave {
    0%, 100% { transform: rotate(0deg) scale(1, 1); }
    22% { transform: rotate(-5deg) translateY(-10px) scale(1.03, 1.03); }
    48% { transform: rotate(4deg) translateY(0) scale(1.02, 0.98); }
    74% { transform: rotate(-4deg) translateY(-6px) scale(1.02, 1.02); }
  }
  @keyframes wave-pop {
    0% { opacity: 0; transform: scale(0.5) rotate(-12deg); }
    20% { opacity: 1; transform: scale(1.1) rotate(6deg); }
    50% { opacity: 1; transform: scale(0.95) rotate(-6deg); }
    80% { opacity: 1; transform: scale(1.08) rotate(4deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes sub-in {
    0% { opacity: 0; transform: translateY(28px) scale(0.92); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
</style>
</head>
<body>
<script>if (location.search.includes('render=1')) document.documentElement.classList.add('render');</script>
<div class="scene">
  <div class="shake-land full"><div class="shake-card full">
    <div class="dark-paper bleed"></div>
    <div class="dots halftone bleed"></div>

    <div class="spot-wrap">
      <div class="spot-cone"></div>
      <div class="spot-floor"></div>
      <div class="spot-rays"><div class="rays"></div></div>
    </div>

    <div class="mate">
      <div class="layer m-drop"><div class="layer m-wave">
        <div class="layer" id="mate-land"></div>
        <div class="layer" id="mate-wave-a"></div>
        <div class="layer" id="mate-wave-b"></div>
      </div></div>
    </div>

    <div class="wave-lines">
      <svg viewBox="0 0 100 100">
        <path d="M22 68 Q46 38 26 14" fill="none" stroke="#ffcd3c" stroke-width="8" stroke-linecap="round"/>
        <path d="M48 76 Q76 40 52 8" fill="none" stroke="#ffcd3c" stroke-width="7" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="card-wrap">
      <div class="name-card panel">
        <div class="meet-title shout">Meet Mate.</div>
        <div class="meet-sub comic">
          A little light<br>for the <span class="hl">right button.</span>
        </div>
      </div>
    </div>
  </div></div>
</div>
<script src="../../assets/art/src/mate-lib.js"></script>
<script>
  document.getElementById('mate-land').innerHTML = mate({ eyes: 'open', mouth: 'smile', arm: 'none', glow: true, size: 560 });
  document.getElementById('mate-wave-a').innerHTML = mate({ eyes: 'wide', mouth: 'grin', arm: 'stop', glow: true, brows: 'up', size: 560 });
  document.getElementById('mate-wave-b').innerHTML = mate({ eyes: 'happy', mouth: 'grin', arm: 'stop', glow: true, size: 560 });
</script>
</body>
</html>
