<!doctype html>
<html lang="en">
<head>
<meta name="clip" content="duration=4.0;fps=60;width=1920;height=1080;alpha=0">
<meta charset="utf-8">
<title>screamer</title>
<link rel="stylesheet" href="_kit.css">
<style>
  /* Screamer, 4.0 s: a calm desktop, a giant Mate rockets up and lands with a flash and a shake,
     BOO! slams in, a caption owns up, he turns into a winking Mate and drops back out of frame.
     Mate is 1120 px wide (4.3077 px per mate-lib unit): his base lands at y 1066 and his glass
     starts at y 256, so he fills 810 px (75 %) of the height; his head centre is at 800,583. */
  .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #bcc8d6; }
  .full { position: absolute; inset: 0; }
  .bleed { position: absolute; inset: -24px; } /* oversized so the shake never shows an edge */

  /* The plain fake desktop: blank windows, no text, no brands. */
  .desk { background: linear-gradient(160deg, #d6dfe9 0%, #bcc8d6 50%, #a3b2c4 100%); }
  .win {
    position: absolute; overflow: hidden; border-radius: 14px; background: #f6f8fb;
    box-shadow: 0 18px 42px rgb(31 42 68 / 0.22), 0 0 0 1px rgb(31 42 68 / 0.1);
    animation: flinch 0.5s linear 0.5s both;
  }
  .win::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 40px; background: #dfe6ee; }
  .win::after {
    content: ""; position: absolute; left: 18px; top: 14px; width: 12px; height: 12px; border-radius: 50%;
    background: #b4bfcc; box-shadow: 20px 0 0 #b4bfcc, 40px 0 0 #b4bfcc;
  }
  .win i { position: absolute; left: 32px; height: 18px; border-radius: 9px; background: #e3e8ef; }
  .taskbar {
    position: absolute; left: -24px; right: -24px; bottom: -24px; height: 84px; box-sizing: border-box; padding-top: 12px;
    display: flex; justify-content: center; align-items: flex-start; gap: 16px; background: rgb(255 255 255 / 0.45);
  }
  .taskbar i { width: 40px; height: 40px; border-radius: 10px; background: rgb(31 42 68 / 0.18); }

  /* The lights dim around him (bleed 824,607 = scene 800,583). */
  .dim {
    background: radial-gradient(circle at 824px 607px, rgb(31 42 68 / 0) 18%, rgb(31 42 68 / 0.6) 72%);
    animation: fade-in 0.12s ease-out 0.48s both, fade-out 0.45s ease-in 3.1s forwards;
  }

  /* The windows get a fright too. */
  .bang {
    position: absolute; font-size: 130px; line-height: 1; color: var(--alarm);
    -webkit-text-stroke: 12px var(--ink); filter: drop-shadow(6px 6px 0 var(--ink));
    animation: pop-in 0.26s var(--pop) var(--t) both, fade-out 0.2s ease-in 1.3s forwards;
  }

  .rays-pop {
    position: absolute; left: -500px; top: -717px; width: 2600px; height: 2600px;
    animation: rays-in 0.34s var(--pop) 0.48s both, rays-out 0.4s ease-in 3.1s forwards;
  }
  .rays-pop .rays, .rays-pop .halftone { position: absolute; inset: 0; }
  .rays-pop .rays { animation: spin 9s linear 0.48s infinite both; }
  .rays-pop .halftone {
    --dot: rgb(255 226 120 / 0.4);
    -webkit-mask-image: radial-gradient(circle, #000 10%, transparent 34%);
    mask-image: radial-gradient(circle, #000 10%, transparent 34%);
  }

  .speed { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; animation: speed 0.26s linear 0.3s both; }
  .speed i { position: absolute; width: 18px; border-radius: 9px; background: linear-gradient(rgb(255 255 255 / 0.95), rgb(255 255 255 / 0)); }

  .mate { position: absolute; left: 326px; top: 170px; width: 1120px; height: 1034px; }
  .layer { position: absolute; inset: 0; transform-origin: 42.3% 86.7%; } /* origin = his base */
  .mate svg { display: block; }
  .m-rocket { animation: rocket 0.55s linear 0.3s both; }
  .m-exit { animation: exit 0.7s linear 3.1s both; }
  .m-tilt { animation: tilt 0.42s linear 2.36s both; }
  #mate-boo { animation: fade-out 0.05s linear 2.56s both; }
  .m-happy { animation: fade-in 0.14s ease-out 2.4s both; }
  /* The wink: an open-eyed drawing shows through only around his right eye (mate-lib units
     x 114-148, y 56-114), so one eye stays a happy arc. Everything else in that box is identical. */
  .m-wink { clip-path: inset(23.33% 43.08% 52.5% 43.85%); }

  .sparkle {
    position: absolute; width: 140px; height: 140px; translate: -50% -50%;
    animation: twinkle 0.4s linear var(--t) both, fade-out 0.22s ease-in 2.98s forwards;
  }
  .sparkle.small { width: 80px; height: 80px; }
  .sparkle i {
    position: absolute; inset: 0; background: var(--ink);
    clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
  }
  .sparkle i + i { inset: 12px; background: #fffbe0; }
  .sparkle.small i + i { inset: 8px; }

  .boo {
    position: absolute; left: 1110px; top: 24px; width: 790px; height: 540px; rotate: -6deg;
    animation: boo-slam 0.4s linear 0.7s both, boo-out 0.3s ease-in 3.1s forwards;
  }
  .boo-jit { position: absolute; inset: 0; animation: jitter 0.12s linear 1.1s 4 both; }
  .boo .burst { position: absolute; inset: 0; }
  .boo .b-shadow { background: var(--ink); translate: 18px 18px; }
  .boo .b-ink { background: var(--ink); }
  .boo .b-fill { inset: 14px; background: var(--white); }
  .boo-text {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 200px; line-height: 1; color: var(--alarm);
    -webkit-text-stroke: 14px var(--ink); filter: drop-shadow(10px 10px 0 var(--ink));
  }

  .cap-row { position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: center; }
  .cap {
    padding: 10px 46px 18px; background: #fff1a6; font-size: 72px; line-height: 1.25; white-space: nowrap; rotate: -1.5deg;
    animation: pop-in 0.36s var(--pop) 1.5s both, cap-out 0.3s ease-in 3.1s forwards;
  }

  .flash { background: var(--white); animation: flash 0.3s ease-out 0.5s both; }
  .shake-a { animation: shake8 0.28s linear 0.5s both; }
  .shake-b { animation: shake 0.2s linear 0.86s both; }

  @keyframes flinch {
    0% { transform: translate(0, 0) rotate(0deg); animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1); }
    14% { transform: translate(var(--fx), -26px) rotate(var(--fr)); animation-timing-function: ease-in-out; }
    42% { transform: translate(0, 6px) rotate(0deg); animation-timing-function: ease-out; }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes rays-in {
    0% { opacity: 0; transform: scale(0.2); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes rays-out {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.6); }
  }
  @keyframes speed {
    0% { opacity: 0; transform: translateY(700px); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-500px); }
  }
  /* Up from below the frame stretched (scaleY 1.35), a small overshoot, then the landing squash
     (scaleY 0.75) at 0.53 s and a rebound. Contact is at 0.5 s: flash and shake start there. */
  @keyframes rocket {
    0% { transform: translateY(1400px) scale(0.78, 1.35); animation-timing-function: cubic-bezier(0.15, 0.85, 0.35, 1); }
    24% { transform: translateY(-110px) scale(0.86, 1.28); animation-timing-function: cubic-bezier(0.55, 0, 0.9, 0.5); }
    36% { transform: translateY(0) scale(0.92, 1.18); animation-timing-function: cubic-bezier(0.2, 0.8, 0.3, 1); }
    42% { transform: translateY(0) scale(1.3, 0.75); animation-timing-function: ease-in-out; }
    60% { transform: translateY(0) scale(0.9, 1.12); animation-timing-function: ease-in-out; }
    78% { transform: translateY(0) scale(1.05, 0.96); animation-timing-function: ease-in-out; }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes flash {
    0% { opacity: 0; }
    12% { opacity: 0.85; }
    100% { opacity: 0; }
  }
  @keyframes shake8 {
    0%, 100% { transform: translate(0, 0); }
    12% { transform: translate(-8px, 6px); }
    25% { transform: translate(8px, -6px); }
    37% { transform: translate(-7px, -4px); }
    50% { transform: translate(6px, 5px); }
    62% { transform: translate(-5px, 3px); }
    75% { transform: translate(4px, -3px); }
    87% { transform: translate(-2px, 1px); }
  }
  @keyframes boo-slam {
    0% { opacity: 0; transform: scale(0) rotate(-24deg); animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1); }
    35% { opacity: 1; transform: scale(1.6) rotate(8deg); animation-timing-function: cubic-bezier(0.5, 0, 0.6, 1); }
    62% { transform: scale(0.88) rotate(-3deg); animation-timing-function: ease-out; }
    82% { transform: scale(1.06) rotate(1deg); animation-timing-function: ease-in-out; }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes jitter {
    0%, 49.9% { transform: rotate(-2deg) scale(1.03); }
    50%, 99.9% { transform: rotate(2deg) scale(0.98); }
    100% { transform: rotate(0deg) scale(1); }
  }
  @keyframes boo-out {
    0% { opacity: 1; transform: scale(1) rotate(0deg); }
    100% { opacity: 0; transform: scale(0.4) rotate(12deg); }
  }
  @keyframes cap-out {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(80px) scale(0.85); }
  }
  @keyframes tilt {
    0% { transform: rotate(0deg) scale(1, 1); animation-timing-function: ease-out; }
    28% { transform: rotate(2deg) scale(1.07, 0.92); animation-timing-function: ease-in-out; }
    62% { transform: rotate(-9deg) scale(0.97, 1.05); animation-timing-function: ease-in-out; }
    100% { transform: rotate(-6deg) scale(1, 1); }
  }
  @keyframes twinkle {
    0% { opacity: 0; transform: scale(0) rotate(-120deg); animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1); }
    55% { opacity: 1; transform: scale(1.25) rotate(10deg); animation-timing-function: ease-in-out; }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  /* A little squash, a hop, then he shrinks and drops out of frame by 3.8 s. */
  @keyframes exit {
    0% { transform: translateY(0) scale(1, 1); animation-timing-function: ease-out; }
    18% { transform: translateY(0) scale(1.12, 0.86); animation-timing-function: ease-out; }
    36% { transform: translateY(-60px) scale(0.9, 1.12); animation-timing-function: cubic-bezier(0.55, 0, 0.9, 0.45); }
    100% { transform: translateY(1300px) scale(0.3, 0.38); }
  }
</style>
</head>
<body>
<script>if (location.search.includes('render=1')) document.documentElement.classList.add('render');</script>
<div class="scene">
  <div class="shake-a full"><div class="shake-b full">
    <div class="desk bleed"></div>
    <div class="win" style="left: 90px; top: 70px; width: 560px; height: 360px; --fx: -14px; --fr: -3deg">
      <i style="top: 76px; width: 62%"></i><i style="top: 116px; width: 80%"></i><i style="top: 156px; width: 48%"></i>
    </div>
    <div class="win" style="left: 780px; top: 120px; width: 660px; height: 430px; --fx: 10px; --fr: 2deg">
      <i style="top: 76px; width: 70%"></i><i style="top: 116px; width: 55%"></i><i style="top: 156px; width: 82%"></i><i style="top: 196px; width: 40%"></i>
    </div>
    <div class="win" style="left: 130px; top: 560px; width: 470px; height: 300px; --fx: -18px; --fr: 4deg">
      <i style="top: 76px; width: 74%"></i><i style="top: 116px; width: 50%"></i>
    </div>
    <div class="win" style="left: 1290px; top: 590px; width: 560px; height: 330px; --fx: 16px; --fr: -2.5deg">
      <i style="top: 76px; width: 58%"></i><i style="top: 116px; width: 78%"></i><i style="top: 156px; width: 36%"></i>
    </div>
    <div class="taskbar"><i></i><i></i><i></i><i></i><i></i></div>

    <div class="dim bleed"></div>
    <div class="bang shout" style="left: 604px; top: 8px; --t: 0.56s">!</div>
    <div class="bang shout" style="left: 70px; top: 430px; --t: 0.64s">!</div>

    <div class="rays-pop"><div class="halftone"></div><div class="rays"></div></div>

    <div class="speed">
      <i style="left: 470px; top: 330px; height: 460px"></i>
      <i style="left: 590px; top: 260px; height: 560px"></i>
      <i style="left: 700px; top: 380px; height: 420px"></i>
      <i style="left: 900px; top: 300px; height: 520px"></i>
      <i style="left: 1010px; top: 400px; height: 440px"></i>
      <i style="left: 1130px; top: 280px; height: 500px"></i>
    </div>

    <div class="mate">
      <div class="layer m-rocket"><div class="layer m-exit"><div class="layer m-tilt">
        <div class="layer" id="mate-boo"></div>
        <div class="layer m-happy">
          <div class="layer" id="mate-happy"></div>
          <div class="layer m-wink" id="mate-wink"></div>
        </div>
        <div class="sparkle" style="left: 11.5%; top: 21.7%; --t: 2.55s"><i></i><i></i></div>
        <div class="sparkle small" style="left: 5.4%; top: 34.2%; --t: 2.63s"><i></i><i></i></div>
      </div></div></div>
    </div>

    <div class="boo"><div class="boo-jit">
      <div class="burst b-shadow"></div>
      <div class="burst b-ink"></div>
      <div class="burst b-fill"></div>
      <div class="boo-text shout">BOO!</div>
    </div></div>

    <div class="cap-row"><div class="cap panel comic">Just kidding, it&rsquo;s me, Mate!</div></div>

    <div class="flash bleed"></div>
  </div></div>
</div>
<script src="../../assets/art/src/mate-lib.js"></script>
<script>
  document.getElementById('mate-boo').innerHTML = mate({ eyes: 'wide', mouth: 'grin', arm: 'stop', glow: true, brows: 'high', size: 1120 });
  document.getElementById('mate-happy').innerHTML = mate({ eyes: 'happy', mouth: 'smile', arm: 'stop', glow: true, size: 1120 });
  document.getElementById('mate-wink').innerHTML = mate({ eyes: 'open', mouth: 'smile', arm: 'stop', glow: true, brows: 'up', size: 1120 });
</script>
</body>
