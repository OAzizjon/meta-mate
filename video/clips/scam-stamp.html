<!DOCTYPE html>
<html lang="en">
<head>
<meta name="clip" content="duration=3;fps=60;width=1920;height=1080;alpha=0">
<link rel="stylesheet" href="_kit.css">
<style>
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden;
               background: var(--paper, #F6EFDF); }
  .stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
           font-family: var(--comic, "Comic Sans MS", "Comic Neue", cursive);
           color: var(--ink, #1F2A44); }
  .bg-dots { position: absolute; inset: 0; opacity: .55; }
  .bg-rays { position: absolute; left: 260px; top: -180px; width: 1400px; height: 1400px; opacity: .35; }

  .popup { position: absolute; left: 480px; top: 230px; width: 960px; height: 620px;
           background: #FFFDF6; border: 8px solid var(--ink, #1F2A44); border-radius: 22px;
           box-shadow: 14px 14px 0 rgba(31, 42, 68, .35);
           transform: rotate(-8deg);
           animation: win-pop .3s 0s both; }
  .pop-head { position: absolute; left: 0; right: 0; top: 42px; text-align: center;
              font-size: 92px; font-weight: 900; line-height: 1; white-space: nowrap;
              color: var(--alarm, #E23B2E);
              text-shadow: 5px 5px 0 rgba(31, 42, 68, .2); }
  .pop-brand { position: absolute; left: 230px; top: 200px; width: 500px; height: 74px;
               background: var(--bulb, #FFD34D); border: 6px solid var(--ink, #1F2A44);
               border-radius: 14px; box-shadow: 7px 7px 0 var(--ink, #1F2A44);
               font-size: 50px; font-weight: 700; line-height: 74px; text-align: center; }
  .pop-line { position: absolute; left: 0; right: 0; top: 316px; text-align: center;
              font-size: 46px; font-weight: 700; }
  .pop-btn { position: absolute; left: 250px; top: 408px; width: 460px; height: 140px;
             background: var(--alarm, #E23B2E); color: #FFFDF6;
             border: 8px solid var(--ink, #1F2A44); border-radius: 20px;
             box-shadow: 10px 10px 0 var(--ink, #1F2A44);
             font-size: 76px; font-weight: 900; line-height: 124px; text-align: center; }

  .stamp-wrap { position: absolute; left: 510px; top: 420px; width: 900px; height: 240px;
                animation: stamp-wobble .6s 2.4s both; }
  .stamp { width: 900px; height: 240px; box-sizing: border-box; white-space: nowrap;
           border: 12px solid var(--alarm, #E23B2E); border-radius: 18px;
           outline: 6px solid var(--alarm, #E23B2E); outline-offset: -30px;
           background: rgba(255, 253, 246, .92);
           color: var(--alarm, #E23B2E);
           font-size: 100px; font-weight: 900; letter-spacing: 2px;
           line-height: 216px; text-align: center;
           transform: rotate(-8deg);
           animation: stamp-slam .4s .3s both; }

  .plate { position: absolute; left: 560px; top: 880px; width: 800px; height: 110px;
           background: var(--ink, #1F2A44); color: #FFFDF6;
           border-radius: 16px; box-shadow: 10px 10px 0 rgba(31, 42, 68, .3);
           font-size: 68px; font-weight: 900; line-height: 110px; text-align: center;
           animation: plate-in .8s .8s both; }

  .badge { position: absolute; left: 1260px; top: 780px; width: 460px; height: 92px;
           background: var(--bulb, #FFD34D); border: 6px solid var(--ink, #1F2A44);
           border-radius: 46px; box-shadow: 7px 7px 0 var(--ink, #1F2A44);
           font-size: 46px; font-weight: 700; line-height: 92px; text-align: center;
           animation: badge-pop .45s 1.4s both; }

  @keyframes win-pop {
    0% { opacity: 0; transform: rotate(-8deg) scale(.65); }
    65% { opacity: 1; transform: rotate(-8deg) scale(1.05); }
    100% { opacity: 1; transform: rotate(-8deg) scale(1); }
  }
  @keyframes stamp-slam {
    0% { opacity: 0; transform: translate(430px, -380px) rotate(-8deg) scale(.3);
         animation-timing-function: cubic-bezier(.5, .05, .7, .4); }
    55% { opacity: 1; transform: translate(6px, -5px) rotate(-8deg) scale(1.4);
          animation-timing-function: linear; }
    70% { transform: translate(-5px, 4px) rotate(-8deg) scale(1.12); }
    82% { transform: translate(4px, -3px) rotate(-8deg) scale(1.03); }
    92% { transform: translate(-2px, 2px) rotate(-8deg) scale(1); }
    100% { transform: translate(0, 0) rotate(-8deg) scale(1); }
  }
  @keyframes stamp-wobble {
    0% { transform: rotate(0deg); }
    22% { transform: rotate(-1.6deg); }
    55% { transform: rotate(1.1deg); }
    78% { transform: rotate(-0.7deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes plate-in {
    0% { transform: translateX(-115%); animation-timing-function: cubic-bezier(.2, .7, .3, 1); }
    100% { transform: translateX(0); }
  }
  @keyframes badge-pop {
    0% { opacity: 0; transform: scale(0) rotate(12deg); }
    60% { opacity: 1; transform: scale(1.18) rotate(-5deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
</style>
</head>
<body>
<script>if (location.search.includes('render=1')) document.documentElement.classList.add('render');</script>
<div class="stage">
  <div class="halftone bg-dots"></div>
  <div class="rays bg-rays"></div>

  <div class="popup">
    <div class="pop-head shout">ZONK! YOU WON!</div>
    <div class="pop-brand">Moon Cheese Club</div>
    <div class="pop-line">Claim 9,000 lunar cheeses!</div>
    <div class="pop-btn">Pay now</div>
  </div>

  <div class="stamp-wrap">
    <div class="stamp shout">SCAM ALERT!</div>
  </div>

  <div class="plate">40 of 40 scams caught</div>
  <div class="badge">English + Russian</div>
</div>
</body>
</html>
