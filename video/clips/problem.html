<!doctype html>
<html lang="en">
<head>
<meta name="clip" content="duration=6.0;fps=60;width=1920;height=1080;alpha=0">
<meta charset="utf-8">
<title>problem</title>
<link rel="stylesheet" href="_kit.css">
<style>
  /* Problem, 6.0 s: the pain, warm not mocking. A cluttered fake app window with menus and
     20 tiny unlabeled toolbar icons sits on warm paper; a small hand cursor wanders, hesitates
     and circles while question marks pop around it (0.5-3.0 s); a comic phone with a speech
     balloon slides in (3.0-4.0 s); the headline slams in at 4.2 s and holds to 6.0 s. */
  .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
  .full { position: absolute; inset: 0; }
  .bleed { position: absolute; inset: -24px; }

  .warm {
    background: radial-gradient(circle at 960px 540px, #fff8e4 0%, #fcf4dc 52%, #f0dfc0 100%);
  }
  .dots {
    --dot: rgb(140 82 20 / 0.13);
    -webkit-mask-image: radial-gradient(circle at 960px 540px, transparent 18%, #000 78%);
    mask-image: radial-gradient(circle at 960px 540px, transparent 18%, #000 78%);
  }

  /* Stage group shifts down slightly when the 4.2 s headline slams in above it. */
  .desk-stage {
    position: absolute; inset: 0;
    animation: stage-duck 0.34s var(--snap) 4.2s both;
  }

  /* Cluttered fake app window in comic style. */
  .app-win {
    position: absolute; left: 110px; top: 150px; width: 1360px; height: 760px;
    box-sizing: border-box; overflow: hidden; background: #f7f4eb;
    animation: win-in 0.35s var(--snap) 0s both;
  }
  .titlebar {
    height: 54px; background: #d8e2ec; border-bottom: 5px solid var(--ink);
    display: flex; align-items: center; padding: 0 20px; gap: 12px;
  }
  .win-dot {
    width: 18px; height: 18px; border-radius: 50%; border: 4px solid var(--ink); background: var(--white);
  }
  .win-dot.d1 { background: #ff9b85; }
  .win-dot.d2 { background: #ffe082; }
  .win-dot.d3 { background: #a5d6a7; }
  .title-pill {
    margin-left: 16px; width: 220px; height: 20px; border-radius: 10px;
    background: #9eb1c4; border: 3px solid var(--ink);
  }

  /* Fake menu bar row. */
  .menubar {
    height: 46px; background: #eae5d7; border-bottom: 4px solid var(--ink);
    display: flex; align-items: center; padding: 0 18px; gap: 16px;
  }
  .menu-item {
    height: 20px; border-radius: 8px; background: #c5beb0; border: 3px solid var(--ink);
  }
  .menu-drop {
    position: absolute; left: 210px; top: 100px; width: 210px; padding: 10px;
    background: var(--white); border: 4px solid var(--ink); border-radius: 12px;
    box-shadow: 6px 6px 0 var(--ink); z-index: 2;
    display: flex; flex-direction: column; gap: 8px;
  }
  .menu-drop i {
    display: block; height: 14px; border-radius: 6px; background: #d5cfc2; border: 2px solid var(--ink);
  }

  /* Generic toolbar of 20 tiny unlabeled icons. */
  .toolbar {
    height: 76px; background: #e2dcd0; border-bottom: 5px solid var(--ink);
    display: grid; grid-template-columns: repeat(20, 1fr); align-items: center;
    padding: 0 16px; gap: 8px;
  }
  .tb-btn {
    height: 48px; border: 3.5px solid var(--ink); border-radius: 10px;
    background: var(--white); box-shadow: 3px 3px 0 var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .tb-btn svg { width: 24px; height: 24px; stroke: var(--ink); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  /* Cluttered inner workspace: sidebars, mystery sliders, dense grids and toggles. */
  .workspace {
    position: absolute; left: 0; right: 0; top: 186px; bottom: 0;
    display: grid; grid-template-columns: 260px 1fr 310px;
  }
  .side-left {
    border-right: 5px solid var(--ink); background: #efeae0; padding: 18px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .tree-row { display: flex; align-items: center; gap: 10px; }
  .tree-box { width: 20px; height: 20px; border: 3px solid var(--ink); border-radius: 5px; background: var(--white); flex-shrink: 0; }
  .tree-bar { height: 16px; border-radius: 7px; background: #cbd3dc; border: 3px solid var(--ink); }

  .center-maze {
    padding: 22px; background: #fbf9f3;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 118px; gap: 18px;
  }
  .sub-card {
    border: 4px solid var(--ink); border-radius: 14px; background: var(--white);
    box-shadow: 5px 5px 0 var(--ink); padding: 12px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .sub-head { display: flex; justify-content: space-between; align-items: center; }
  .sub-pill { width: 58%; height: 14px; border-radius: 6px; background: #b8c4d0; border: 2.5px solid var(--ink); }
  .sub-dot { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--ink); background: #ffd88a; }
  .sub-lines { display: flex; flex-direction: column; gap: 8px; }
  .sub-line { height: 10px; border-radius: 5px; background: #e1ddd2; border: 2px solid var(--ink); }
  .sub-knobs { display: flex; gap: 8px; }
  .sub-knob { flex: 1; height: 22px; border-radius: 6px; border: 2.5px solid var(--ink); background: #eef2f6; }

  .side-right {
    border-left: 5px solid var(--ink); background: #efeae0; padding: 18px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .slider-row {
    border: 3.5px solid var(--ink); border-radius: 10px; background: var(--white); padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .slider-track { height: 10px; border-radius: 5px; background: #d6d0c4; border: 2.5px solid var(--ink); position: relative; }
  .slider-thumb { position: absolute; top: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--bulb); border: 3px solid var(--ink); }

  /* Wandering, hesitating, circling hand cursor. */
  .cursor-roam {
    position: absolute; left: 480px; top: 295px; width: 86px; height: 104px; z-index: 5;
    filter: drop-shadow(6px 6px 0 var(--ink));
    animation: roam 3.6s ease-in-out 0.1s both;
  }
  .cursor-roam svg { display: block; width: 86px; height: 104px; }

  /* Question marks popping around the cursor (0.5-3.0 s). */
  .qmark {
    position: absolute; z-index: 6; font-size: 112px; line-height: 1;
    color: var(--bulb); -webkit-text-stroke: 10px var(--ink);
    filter: drop-shadow(7px 7px 0 var(--ink));
    animation: pop-in 0.34s var(--pop) var(--t) both;
  }
  .qmark.red { color: #ff7a59; }

  /* Comic phone + speech balloon sliding in (3.0-4.0 s). */
  .phone-call {
    position: absolute; left: 1030px; top: 430px; width: 830px; height: 560px; z-index: 8;
    animation: phone-slide 0.68s var(--pop) 3.0s both;
  }
  .balloon {
    position: absolute; left: 0; top: 0; width: 640px; padding: 28px 36px 32px;
    background: #fffdf7; border: 6px solid var(--ink); border-radius: 34px;
    box-shadow: 12px 12px 0 var(--ink);
    font-size: 56px; line-height: 1.22; color: var(--ink); text-align: center;
  }
  .balloon::after {
    content: ""; position: absolute; right: 74px; bottom: -36px;
    width: 44px; height: 44px; background: #fffdf7;
    border-right: 6px solid var(--ink); border-bottom: 6px solid var(--ink);
    transform: rotate(35deg) skewX(12deg);
  }
  .phone-handset {
    position: absolute; right: 24px; bottom: 18px; width: 240px; height: 310px;
    transform-origin: 50% 60%;
    animation: phone-ring 0.45s ease-in-out 3.45s 2 both;
  }
  .phone-handset svg { display: block; width: 100%; height: 100%; filter: drop-shadow(10px 10px 0 var(--ink)); }

  /* Headline slams at 4.2 s (two lines max, <= 6 words per line, >= 64 px). */
  .headline-wrap {
    position: absolute; left: 0; right: 0; top: 28px; z-index: 10;
    display: flex; justify-content: center;
  }
  .headline-card {
    padding: 16px 56px 24px; background: var(--bulb);
    border: 7px solid var(--ink); border-radius: 28px;
    box-shadow: 14px 14px 0 var(--ink);
    text-align: center; rotate: -1deg;
    animation: slam 0.34s var(--snap) 4.2s both;
  }
  .headline-line {
    font-size: 92px; line-height: 1.12; color: var(--white);
    -webkit-text-stroke: 11px var(--ink); filter: drop-shadow(6px 6px 0 var(--ink));
    white-space: nowrap;
  }
  .headline-line.accent {
    color: var(--ink); -webkit-text-stroke: 11px var(--white);
  }

  .shake-slam { animation: shake 0.24s linear 4.38s both; }

  @keyframes win-in {
    from { opacity: 0; transform: translateY(24px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes stage-duck {
    0% { transform: translateY(0); }
    45% { transform: translateY(128px) scale(0.985, 0.96); }
    100% { transform: translateY(112px) scale(0.99, 0.99); }
  }
  @keyframes roam {
    0% { transform: translate(0, 0) rotate(0deg); }
    14% { transform: translate(290px, -10px) rotate(8deg); }
    24% { transform: translate(270px, 15px) rotate(-6deg); }
    38% { transform: translate(580px, 5px) rotate(10deg); }
    50% { transform: translate(420px, 190px) rotate(-12deg); }
    62% { transform: translate(310px, 260px) rotate(6deg); }
    72% { transform: translate(230px, 180px) rotate(-14deg); }
    82% { transform: translate(350px, 120px) rotate(9deg); }
    91% { transform: translate(290px, 210px) rotate(-8deg); }
    100% { transform: translate(260px, 195px) rotate(-4deg); }
  }
  @keyframes phone-slide {
    0% { opacity: 0; transform: translate(540px, 220px) rotate(14deg) scale(0.85); }
    65% { opacity: 1; transform: translate(-18px, -10px) rotate(-2deg) scale(1.03); }
    100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
  }
  @keyframes phone-ring {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-6deg) translate(-4px, -2px); }
    50% { transform: rotate(6deg) translate(4px, -2px); }
    75% { transform: rotate(-4deg); }
  }
</style>
