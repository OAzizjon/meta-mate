<!doctype html>
<html lang="en">
<head>
<meta name="clip" content="duration=3.0;fps=60;width=1080;height=1920;alpha=0">
<meta charset="utf-8">
<title>cold-open-vertical</title>
<link rel="stylesheet" href="_kit.css">
<style>
  body { background: #000; }
  .scene { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  .full { position: absolute; inset: 0; }
  .bleed { position: absolute; inset: -24px; }
  .warm {
    background: radial-gradient(circle at 540px 1110px, #fff8e1 0%, #ffe48f 20%, #ffcd3c 46%, #f5a623 82%, #e08a1e 115%);
    animation: fade-in 0.3s ease-out 0.06s both;
  }
  .dots {
    --dot: rgb(150 72 0 / 0.22);
    -webkit-mask-image: radial-gradient(circle at 540px 1110px, transparent 20%, #000 65%);
    mask-image: radial-gradient(circle at 540px 1110px, transparent 20%, #000 65%);
    animation: dots-in 0.4s var(--snap) 0.1s both;
  }
  .bloom {
    position: absolute; left: -360px; top: 210px; width: 1800px; height: 1800px; border-radius: 50%;
    background: radial-gradient(circle, #fffef5 0%, rgb(255 238 176 / 0.95) 14%, rgb(255 214 90 / 0.5) 36%, rgb(255 205 60 / 0) 68%);
    animation: bloom 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) 0s both;
  }
  .beam {
    position: absolute; left: 690px; top: 1160px; width: 620px; height: 250px; transform-origin: 0 50%;
    filter: drop-shadow(0 0 16px rgb(255 246 200 / 0.9));
    animation: beam-sweep 0.5s linear 1.3s both;
  }
  .beam i {
    position: absolute; inset: 0;
    clip-path: polygon(0 46%, 100% 0, 100% 100%, 0 54%);
    background: linear-gradient(90deg, rgb(255 255 246 / 0.98), rgb(255 249 220 / 0.8) 70%, rgb(255 244 200 / 0.45));
  }
  .ring {
    position: absolute; left: 405px; top: 1250px; width: 550px; height: 270px; box-sizing: border-box;
    border: 12px solid #fff3b0; border-radius: 135px;
    box-shadow: 0 0 0 5px var(--ink), inset 0 0 0 5px var(--ink), 0 0 60px 22px rgb(255 238 160 / 0.85);
    animation: ring-in 0.24s var(--pop) 1.62s both;
  }
  .ring.ping {
    box-shadow: 0 0 0 5px var(--ink), inset 0 0 0 5px var(--ink);
    animation: ping 0.42s ease-out 1.86s both;
  }
  .btn { position: absolute; left: 440px; top: 1280px; width: 480px; height: 210px; transform-origin: 50% 100%; animation: press 0.4s linear 1.8s both; }
  .btn-face {
    position: absolute; inset: 0; box-sizing: border-box;
    border: 7px solid var(--ink); border-radius: 105px;
    background: linear-gradient(180deg, #6d9cc4 0%, #3b6688 100%);
    box-shadow: 12px 12px 0 var(--ink), inset 0 12px 0 rgb(255 255 255 / 0.28);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 104px; line-height: 1; text-shadow: 5px 5px 0 var(--ink);
    animation: press-shadow 0.4s linear 1.8s both;
  }
  .mate { position: absolute; left: 50px; top: 760px; width: 850px; height: 785px; }
  .layer { position: absolute; inset: 0; transform-origin: 42.3% 86.7%; }
  .mate svg { display: block; }
  .m-pop { animation: mate-pop 0.3s linear 0.3s both; }
  .m-bump { animation: bump 0.2s ease-out 1.24s both; }
  .m-hop { animation: hop 0.36s linear 1.92s both; }
  #mate-a { animation: fade-out 0.06s linear 1.31s both; }
  #mate-b { animation: fade-in 0.08s linear 1.24s both, fade-out 0.05s linear 2.03s both; }
  #mate-c { animation: fade-in 0.08s linear 1.94s both; }
  .line { position: absolute; left: 0; right: 0; text-align: center; line-height: 1.05; }
  .line1 { top: 140px; font-size: 92px; color: #fff; -webkit-text-stroke: 9px var(--ink); filter: drop-shadow(7px 7px 0 var(--ink)); }
  .line1 .w { display: block; animation: word-snap 0.22s var(--snap) var(--t) both; }
  .line2 { top: 1570px; font-size: 100px; color: var(--ink); -webkit-text-stroke: 12px #fff; filter: drop-shadow(8px 8px 0 var(--ink)); }
  .line2 .slam-in { display: inline-block; animation: slam 0.32s var(--snap) 2.2s both; }
  .click {
    position: absolute; left: 600px; top: 1020px; width: 430px; height: 290px; rotate: 6deg;
    animation: burst-pop 0.3s linear 1.86s both, burst-out 0.18s ease-in 2.5s both;
  }
  .click .burst { position: absolute; inset: 0; }
  .click .b-shadow { background: var(--ink); translate: 14px 14px; }
  .click .b-ink { background: var(--ink); }
  .click .b-fill { inset: 12px; background: var(--white); }
  .click-text {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 78px; line-height: 1; color: var(--alarm); -webkit-text-stroke: 9px var(--ink); rotate: -10deg;
  }
  .cursor {
    position: absolute; left: 820px; top: 1400px; width: 88px; height: 110px;
    filter: drop-shadow(5px 5px 0 var(--ink));
    animation: cursor-in 0.34s var(--snap) 1.46s both;
  }
  .cursor-press { position: absolute; inset: 0; transform-origin: 7px 7px; animation: cursor-click 0.22s ease-in-out 1.8s both; }
  .cursor svg { display: block; }
  .shake { animation: shake 0.22s linear 2.36s both; }
  .cut { background: #000; animation: fade-in 0.005s linear 2.79s both; }
  @keyframes dots-in { from { opacity: 0; transform: scale(1.25); } to { opacity: 1; transform: scale(1); } }
  @keyframes bloom { 0% { opacity: 0; transform: scale(0.03); } 20% { opacity: 1; } 100% { opacity: 1; transform: scale(1); } }
  @keyframes mate-pop {
    0% { opacity: 0; transform: scale(0.1, 0.1); animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1); }
    15% { opacity: 1; } 45% { transform: scale(0.9, 1.3); animation-timing-function: ease-out; }
    70% { transform: scale(1.22, 1.08); animation-timing-function: ease-in-out; }
    86% { transform: scale(0.96, 1.04); animation-timing-function: ease-in-out; } 100% { opacity: 1; transform: scale(1, 1); }
  }
  @keyframes bump { 0% { transform: scale(1, 1); } 35% { transform: scale(1.08, 0.92); } 70% { transform: scale(0.97, 1.04); } 100% { transform: scale(1, 1); } }
  @keyframes hop {
    0% { transform: translateY(0) scale(1, 1); animation-timing-function: ease-out; }
    18% { transform: translateY(0) scale(1.1, 0.88); animation-timing-function: ease-out; }
    50% { transform: translateY(-40px) scale(0.94, 1.08); animation-timing-function: ease-in; }
    78% { transform: translateY(0) scale(1.07, 0.93); animation-timing-function: ease-out; } 100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes word-snap { 0% { opacity: 0; transform: translateY(-50px) scale(1.7) rotate(-8deg); } 60% { opacity: 1; transform: translateY(6px) scale(0.92) rotate(3deg); } 100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); } }
  @keyframes beam-sweep {
    0% { opacity: 0; transform: rotate(-36deg) scaleX(0.3); animation-timing-function: cubic-bezier(0.3, 0.6, 0.4, 1); }
    18% { opacity: 1; } 72% { transform: rotate(7deg) scaleX(1); animation-timing-function: ease-in-out; } 100% { opacity: 1; transform: rotate(3.2deg) scaleX(1); }
  }
  @keyframes ring-in { 0% { opacity: 0; transform: scale(1.5); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes ping { 0% { opacity: 0; transform: scale(1); } 12% { opacity: 1; } 100% { opacity: 0; transform: scale(1.4); } }
  @keyframes press {
    0% { transform: translate(0, 0) scale(1, 1); animation-timing-function: cubic-bezier(0.5, 0, 0.9, 0.5); }
    28% { transform: translate(6px, 8px) scale(1.06, 0.8); animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1); }
    58% { transform: translate(0, -14px) scale(0.96, 1.1); animation-timing-function: ease-in-out; }
    80% { transform: translate(0, 0) scale(1.02, 0.97); animation-timing-function: ease-in-out; } 100% { transform: translate(0, 0) scale(1, 1); }
  }
  @keyframes press-shadow { 0%, 100% { box-shadow: 12px 12px 0 var(--ink), inset 0 12px 0 rgb(255 255 255 / 0.28); } 28% { box-shadow: 3px 3px 0 var(--ink), inset 0 12px 0 rgb(255 255 255 / 0.28); } }
  @keyframes burst-pop {
    0% { opacity: 0; transform: scale(0) rotate(-25deg); animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1); }
    55% { opacity: 1; transform: scale(1.22) rotate(5deg); animation-timing-function: ease-in-out; } 100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes burst-out { 0% { opacity: 1; transform: scale(1) rotate(0deg); } 100% { opacity: 0; transform: scale(0.2) rotate(20deg); } }
  @keyframes cursor-in { 0% { opacity: 0; transform: translate(320px, 300px) rotate(14deg); } 30% { opacity: 1; } 100% { opacity: 1; transform: translate(0, 0) rotate(0deg); } }
  @keyframes cursor-click { 0%, 100% { transform: scale(1); } 40% { transform: scale(0.82); } }
</style>
</head>
<body>
<script>if (location.search.includes('render=1')) document.documentElement.classList.add('render');</script>
<div class="scene">
  <div class="shake full">
    <div class="warm bleed"></div><div class="dots halftone bleed"></div><div class="bloom"></div>
    <div class="beam"><i></i></div><div class="ring"></div><div class="ring ping"></div>
    <div class="btn"><div class="btn-face comic">OK</div></div>
    <div class="mate"><div class="layer m-pop"><div class="layer m-bump"><div class="layer m-hop">
      <div class="layer" id="mate-a"></div><div class="layer" id="mate-b"></div><div class="layer" id="mate-c"></div>
    </div></div></div></div>
    <div class="line line1 shout">
      <span class="w" style="--t: 0.6s">Mate</span><span class="w" style="--t: 0.76s">lights</span>
      <span class="w" style="--t: 0.92s">the</span><span class="w" style="--t: 1.08s">button.</span>
    </div>
    <div class="line line2 shout"><span class="slam-in">You click it.</span></div>
    <div class="click"><div class="burst b-shadow"></div><div class="burst b-ink"></div><div class="burst b-fill"></div><div class="click-text shout">CLICK!</div></div>
    <div class="cursor"><div class="cursor-press">
      <svg viewBox="0 0 80 100" width="88" height="110"><polygon points="6,6 6,80 25,63 37,91 51,85 39,58 64,58" fill="#fff" stroke="#1f2a44" stroke-width="6" stroke-linejoin="round"/></svg>
    </div></div>
  </div>
  <div class="cut full"></div>
</div>
<script src="../../assets/art/src/mate-lib.js"></script>
<script>
  document.getElementById('mate-a').innerHTML = mate({ eyes: 'open', mouth: 'smile', arm: 'none', glow: false, size: 850 });
  document.getElementById('mate-b').innerHTML = mate({ eyes: 'open', mouth: 'smile', arm: 'point', glow: true, size: 850 });
  document.getElementById('mate-c').innerHTML = mate({ eyes: 'happy', mouth: 'grin', arm: 'point', glow: true, size: 850 });
</script>
</body>
</html>
