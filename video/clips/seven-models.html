<!doctype html>
<html lang="en">
<head>
<meta name="clip" content="duration=5.0;fps=60;width=1920;height=1080;alpha=0">
<meta charset="utf-8">
<title>seven-models</title>
<link rel="stylesheet" href="_kit.css">
<style>
  /* Seven models, 5.0 s: "7 META MODELS" slams and moves up, a small glowing Mate pops in, seven
     name badges land 0.25 s apart, each lit by a beam from his glass (centre 960,560),
     "ONE LITTLE MATE." slams at 3.2 s, then a gentle glow pulse 4.2-5.0 s that ends at rest. */
  .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
  .full { position: absolute; inset: 0; }
  .bleed { position: absolute; inset: -24px; } /* oversized so the shake never shows an edge */

  .paper { background: radial-gradient(circle at 984px 584px, #fff2c4 0%, #fcf9f1 50%, #f1e7d0 100%); }
  .dots {
    --dot: rgb(31 42 68 / 0.1);
    -webkit-mask-image: radial-gradient(circle at 984px 584px, transparent 30%, #000 75%);
    mask-image: radial-gradient(circle at 984px 584px, transparent 30%, #000 75%);
  }

  .glow { position: absolute; left: 560px; top: 160px; width: 800px; height: 800px; animation: glow-in 0.4s var(--snap) 0.5s both; }
  .glow-pulse {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, rgb(255 236 160 / 0.95) 0%, rgb(255 214 90 / 0.5) 35%, rgb(255 205 60 / 0) 70%);
    animation: glow-pulse 0.8s ease-in-out 4.2s both;
  }

  /* One beam per badge: static angle and length on .beam, the shot itself on its <i>. */
  .beams { position: absolute; inset: 0; animation: beam-pulse 0.8s ease-in-out 4.2s both; }
  .beam { position: absolute; left: 960px; top: 505px; height: 110px; transform-origin: 0 50%; }
  .beam i {
    position: absolute; inset: 0; transform-origin: 0 50%;
    clip-path: polygon(0 44%, 100% 0, 100% 100%, 0 56%);
    background: linear-gradient(90deg, rgb(255 214 90 / 0) 0%, rgb(255 214 90 / 0.55) 35%, rgb(255 205 60 / 0.9) 100%);
    animation: shoot 0.3s var(--snap) calc(var(--t) - 0.1s) both;
  }

  .mate { position: absolute; left: 816px; top: 440px; width: 340px; height: 314px; }
  .layer { position: absolute; inset: 0; transform-origin: 42.3% 86.7%; } /* origin = his base */
  .mate svg { display: block; }
  .m-pop { animation: mate-pop 0.32s linear 0.55s both; }
  .m-hop { animation: hop 0.36s linear 3.2s both; }
  .m-breathe { animation: breathe 0.8s ease-in-out 4.2s both; }
  #mate-a { animation: fade-out 0.06s linear 3.34s both; }
  #mate-b { animation: fade-in 0.1s linear 3.24s both; }

  .badge {
    position: absolute; translate: -50% -50%; padding: 12px 34px 16px; white-space: nowrap;
    border: 5px solid var(--ink); border-radius: 24px; background: var(--c);
    box-shadow: 8px 8px 0 var(--ink); font-size: 48px; line-height: 1.2; color: var(--ink);
    animation: pop-in 0.34s var(--pop) var(--t) both, lit 0.6s ease-out var(--t) both;
  }

  .title-row { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; animation: title-up 0.32s var(--snap) 0.5s both; }
  .title {
    font-size: 160px; line-height: 1.2; white-space: nowrap; color: var(--bulb);
    -webkit-text-stroke: 14px var(--ink); filter: drop-shadow(9px 9px 0 var(--ink));
    animation: slam 0.3s var(--snap) 0s both;
  }
  .tag-row { position: absolute; left: 0; right: 0; top: 880px; display: flex; justify-content: center; }
  .tag {
    font-size: 120px; line-height: 1.2; white-space: nowrap; color: var(--ink);
    -webkit-text-stroke: 14px var(--white); filter: drop-shadow(8px 8px 0 var(--ink));
    animation: slam 0.32s var(--snap) 3.2s both;
  }

  .shake-a { animation: shake 0.22s linear 0.18s both; }
  .shake-b { animation: shake 0.22s linear 3.36s both; }

  @keyframes title-up {
    from { transform: translateY(0) scale(1); }
    to { transform: translateY(-404px) scale(0.62); }
  }
  @keyframes glow-in {
    0% { opacity: 0; transform: scale(0.2); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes glow-pulse {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.16); }
  }
  @keyframes beam-pulse {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; }
  }
  @keyframes shoot {
    0% { opacity: 0; transform: scaleX(0); }
    40% { opacity: 1; transform: scaleX(1); }
    100% { opacity: 0.75; transform: scaleX(1); }
  }
  @keyframes lit {
    0% { box-shadow: 8px 8px 0 var(--ink), 0 0 0 0 rgb(255 214 90 / 0); }
    25% { box-shadow: 8px 8px 0 var(--ink), 0 0 0 22px rgb(255 214 90 / 0.95); }
    100% { box-shadow: 8px 8px 0 var(--ink), 0 0 36px 12px rgb(255 214 90 / 0.6); }
  }
  @keyframes mate-pop {
    0% { opacity: 0; transform: scale(0.1, 0.1); animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1); }
    15% { opacity: 1; }
    45% { transform: scale(0.9, 1.3); animation-timing-function: ease-out; }
    70% { transform: scale(1.22, 1.08); animation-timing-function: ease-in-out; }
    86% { transform: scale(0.96, 1.04); animation-timing-function: ease-in-out; }
    100% { opacity: 1; transform: scale(1, 1); }
  }
  @keyframes hop {
    0% { transform: translateY(0) scale(1, 1); animation-timing-function: ease-out; }
    18% { transform: translateY(0) scale(1.1, 0.88); animation-timing-function: ease-out; }
    50% { transform: translateY(-34px) scale(0.94, 1.08); animation-timing-function: ease-in; }
    78% { transform: translateY(0) scale(1.07, 0.93); animation-timing-function: ease-out; }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1, 1); }
    50% { transform: scale(1.05, 1.05); }
  }
</style>
</head>
<body>
<script>if (location.search.includes('render=1')) document.documentElement.classList.add('render');</script>
<div class="scene">
  <div class="shake-a full"><div class="shake-b full">
    <div class="paper bleed"></div>
    <div class="dots halftone bleed"></div>

    <div class="glow"><div class="glow-pulse"></div></div>

    <div class="beams">
      <div class="beam" style="width: 270px; transform: rotate(-90deg); --t: 0.85s"><i></i></div>
      <div class="beam" style="width: 516px; transform: rotate(-18.08deg); --t: 1.1s"><i></i></div>
      <div class="beam" style="width: 532px; transform: rotate(4.32deg); --t: 1.35s"><i></i></div>
      <div class="beam" style="width: 436px; transform: rotate(31.87deg); --t: 1.6s"><i></i></div>
      <div class="beam" style="width: 436px; transform: rotate(148.13deg); --t: 1.85s"><i></i></div>
      <div class="beam" style="width: 532px; transform: rotate(175.68deg); --t: 2.1s"><i></i></div>
      <div class="beam" style="width: 516px; transform: rotate(-161.92deg); --t: 2.35s"><i></i></div>
    </div>

    <div class="mate">
      <div class="layer m-pop"><div class="layer m-hop"><div class="layer m-breathe">
        <div class="layer" id="mate-a"></div>
        <div class="layer" id="mate-b"></div>
      </div></div></div>
    </div>

    <div class="badge comic" style="left: 960px; top: 290px; --t: 0.85s; --c: #ffd8cf">Muse Spark 1.3</div>
    <div class="badge comic" style="left: 1450px; top: 400px; --t: 1.1s; --c: #d6ecff">Muse Wonder 1.0</div>
    <div class="badge comic" style="left: 1490px; top: 600px; --t: 1.35s; --c: #dff5d8">Muse Voice Transcribe</div>
    <div class="badge comic" style="left: 1330px; top: 790px; --t: 1.6s; --c: #fff0b8">SAM 3.1</div>
    <div class="badge comic" style="left: 590px; top: 790px; --t: 1.85s; --c: #e8dcff">Muse Glimmer 30B</div>
    <div class="badge comic" style="left: 430px; top: 600px; --t: 2.1s; --c: #ffe2c4">Muse Image</div>
    <div class="badge comic" style="left: 470px; top: 400px; --t: 2.35s; --c: #d3f3ee">MMS-TTS</div>

    <div class="title-row"><div class="title shout">7 META MODELS</div></div>
    <div class="tag-row"><div class="tag shout">ONE LITTLE MATE.</div></div>
  </div></div>
</div>
<script src="../../assets/art/src/mate-lib.js"></script>
<script>
  document.getElementById('mate-a').innerHTML = mate({ eyes: 'open', mouth: 'smile', arm: 'none', glow: true, size: 340 });
  document.getElementById('mate-b').innerHTML = mate({ eyes: 'happy', mouth: 'grin', arm: 'none', glow: true, size: 340 });
</script>
</body>
</html>
