<!DOCTYPE html>
<html lang="en">
<head>
<meta name="clip" content="duration=3.5;fps=60;width=1920;height=1080;alpha=0">
<link rel="stylesheet" href="_kit.css">
<style>
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden;
               background: var(--paper, #F6EFDF); }
  .stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
           font-family: var(--comic, "Comic Sans MS", "Comic Neue", cursive);
           color: var(--ink, #1F2A44); }
  .bg-dots { position: absolute; inset: 0; opacity: .55; }

  .window { position: absolute; left: 570px; top: 260px; width: 780px; height: 560px;
            background: #FFFDF6; border: 8px solid var(--ink, #1F2A44); border-radius: 22px;
            box-shadow: 14px 14px 0 rgba(31, 42, 68, .35);
            overflow: visible;
            animation: win-pop .3s 0s both; }
  .titlebar { position: absolute; left: 0; top: 0; width: 780px; height: 76px;
              background: var(--ink, #1F2A44); border-radius: 14px 14px 0 0; }
  .dot { position: absolute; top: 26px; width: 26px; height: 26px; border-radius: 50%; }
  .dot.d1 { left: 700px; background: var(--alarm, #E23B2E); }
  .dot.d2 { left: 658px; background: var(--bulb, #FFD34D); }
  .dot.d3 { left: 616px; background: #FFFDF6; }

  .field-label { position: absolute; left: 60px; font-size: 38px; font-weight: 700; }
  .fl-email { top: 116px; }
  .fl-pass { top: 284px; }
  .field-input { position: absolute; left: 60px; width: 660px; height: 84px;
                 background: #FFFFFF; border: 6px solid var(--ink, #1F2A44);
                 border-radius: 14px; box-sizing: border-box;
                 font-size: 42px; font-weight: 700; line-height: 72px; padding: 0 22px; }
  .in-email { top: 162px; }
  .in-pass { top: 330px; }

  .pw-bar { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            background: #000; border-radius: 8px;
            transform-origin: left center;
            animation: bar-paint .4s 1s both; }

  .padlock { position: absolute; right: -36px; top: -48px; width: 58px; height: 62px;
             animation: lock-pop .35s 1.3s both; }
  .padlock .shackle { position: absolute; left: 8px; top: 22px; width: 34px; height: 30px;
                      border: 9px solid var(--ink, #1F2A44); border-bottom: 0;
                      border-radius: 20px 20px 0 0; }
  .padlock .body { position: absolute; left: 0; top: 44px; width: 58px; height: 42px;
                   background: var(--bulb, #FFD34D);
                   border: 6px solid var(--ink, #1F2A44); border-radius: 10px; box-sizing: border-box; }
  .padlock .body::after { content: ""; position: absolute; left: 19px; top: 10px;
                          width: 12px; height: 12px; background: var(--ink, #1F2A44);
                          border-radius: 50%; }

  .login-btn { position: absolute; left: 60px; top: 448px; width: 300px; height: 84px;
               background: var(--ink, #1F2A44); color: #FFFDF6;
               border-radius: 16px; box-shadow: 8px 8px 0 rgba(31, 42, 68, .3);
               font-size: 44px; font-weight: 900; line-height: 84px; text-align: center; }

  .shutter { position: absolute; left: 520px; top: 210px; width: 880px; height: 660px; }
  .corner { position: absolute; width: 100px; height: 100px; opacity: 0; }
  .corner.tl { left: 0; top: 0; border-left: 14px solid var(--ink, #1F2A44); border-top: 14px solid var(--ink, #1F2A44);
               animation: shut-tl .6s .4s both; }
  .corner.tr { right: 0; top: 0; border-right: 14px solid var(--ink, #1F2A44); border-top: 14px solid var(--ink, #1F2A44);
               animation: shut-tr .6s .4s both; }
  .corner.bl { left: 0; bottom: 0; border-left: 14px solid var(--ink, #1F2A44); border-bottom: 14px solid var(--ink, #1F2A44);
               animation: shut-bl .6s .4s both; }
  .corner.br { right: 0; bottom: 0; border-right: 14px solid var(--ink, #1F2A44); border-bottom: 14px solid var(--ink, #1F2A44);
               animation: shut-br .6s .4s both; }

  .headline { position: absolute; left: 0; right: 0; top: 800px; text-align: center;
              font-size: 96px; font-weight: 900;
              text-shadow: 6px 6px 0 rgba(31, 42, 68, .25);
              animation: headline-slam .35s 1.5s both; }
  .subline { position: absolute; left: 0; right: 0; top: 936px; text-align: center;
             font-size: 64px; font-weight: 700;
             animation: fade-in .5s 2.2s both; }

  @keyframes win-pop {
    0% { opacity: 0; transform: scale(.7); }
    65% { opacity: 1; transform: scale(1.04); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes shut-tl {
    0% { opacity: 0; transform: translate(-170px, -150px); animation-timing-function: cubic-bezier(.2, .8, .3, 1); }
    14% { opacity: 1; }
    100% { opacity: 1; transform: translate(0, 0); }
  }
  @keyframes shut-tr {
    0% { opacity: 0; transform: translate(170px, -150px); animation-timing-function: cubic-bezier(.2, .8, .3, 1); }
    14% { opacity: 1; }
    100% { opacity: 1; transform: translate(0, 0); }
  }
  @keyframes shut-bl {
    0% { opacity: 0; transform: translate(-170px, 150px); animation-timing-function: cubic-bezier(.2, .8, .3, 1); }
    14% { opacity: 1; }
    100% { opacity: 1; transform: translate(0, 0); }
  }
  @keyframes shut-br {
    0% { opacity: 0; transform: translate(170px, 150px); animation-timing-function: cubic-bezier(.2, .8, .3, 1); }
    14% { opacity: 1; }
    100% { opacity: 1; transform: translate(0, 0); }
  }
  @keyframes bar-paint {
    0% { transform: scaleX(0); }
    100% { transform: scaleX(1); }
  }
  @keyframes lock-pop {
    0% { opacity: 0; transform: scale(0) rotate(-14deg); }
    60% { opacity: 1; transform: scale(1.2) rotate(6deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes headline-slam {
    0% { opacity: 0; transform: scale(2.4) rotate(-3deg); }
    55% { opacity: 1; transform: scale(.92) rotate(1deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
</style>
</head>
<body>
<script>if (location.search.includes('render=1')) document.documentElement.classList.add('render');</script>
<div class="stage">
  <div class="halftone bg-dots"></div>

  <div class="window">
    <div class="titlebar"></div>
    <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
    <div class="field-label fl-email">Email</div>
    <div class="field-input in-email">you@home.pc</div>
    <div class="field-label fl-pass">Password</div>
    <div class="field-input in-pass">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;
      <div class="pw-bar"></div>
      <div class="padlock"><div class="shackle"></div><div class="body"></div></div>
    </div>
    <div class="login-btn">Log in</div>
  </div>

  <div class="shutter">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
  </div>

  <div class="headline shout">Passwords blacked out</div>
  <div class="subline">before anything leaves your PC</div>
</div>
</body>
</html>
