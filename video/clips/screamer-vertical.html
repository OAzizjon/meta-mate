<!doctype html>
<html lang="en">
<head>
<meta name="clip" content="duration=4.0;fps=60;width=1080;height=1920;alpha=0">
<meta charset="utf-8">
<title>screamer-vertical</title>
<link rel="stylesheet" href="_kit.css">
<style>
  .scene { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; background: #bcc8d6; }
  .full { position: absolute; inset: 0; }
  .bleed { position: absolute; inset: -24px; }
  .desk { background: linear-gradient(160deg, #d6dfe9 0%, #bcc8d6 50%, #a3b2c4 100%); }
  .win {
    position: absolute; overflow: hidden; border-radius: 14px; background: #f6f8fb;
    box-shadow: 0 18px 42px rgb(31 42 68 / 0.22), 0 0 0 1px rgb(31 42 68 / 0.1);
    animation: flinch 0.5s linear 0.5s both;
  }
  .win::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 40px; background: #dfe6ee; }
  .win::after {
    content: ""; position: absolute; left: 18px; top: 14px; width: 12px; height: 12px; border-radius: 50%;
    background: #b4bfcc; box-shadow: 20px 0 0 #b4bfcc, 40px 0 0 #b4bfcc;
  }
  .win i { position: absolute; left: 32px; height: 18px; border-radius: 9px; background: #e3e8ef; }
  .taskbar {
    position: absolute; left: -24px; right: -24px; bottom: -24px; height: 104px; box-sizing: border-box; padding-top: 12px;
    display: flex; justify-content: center; align-items: flex-start; gap: 16px; background: rgb(255 255 255 / 0.45);
  }
  .taskbar i { width: 48px; height: 48px; border-radius: 10px; background: rgb(31 42 68 / 0.18); }
  .dim {
    background: radial-gradient(circle at 540px 1090px, rgb(31 42 68 / 0) 18%, rgb(31 42 68 / 0.6) 72%);
    animation: fade-in 0.12s ease-out 0.48s both, fade-out 0.45s ease-in 3.1s both;
  }
  .bang {
    position: absolute; font-size: 130px; line-height: 1; color: var(--alarm);
    -webkit-text-stroke: 12px var(--ink); filter: drop-shadow(6px 6px 0 var(--ink));
    animation: pop-in 0.26s var(--pop) var(--t) both, fade-out 0.2s ease-in 1.3s both;
  }
  .rays-pop {
    position: absolute; left: -760px; top: 240px; width: 2600px; height: 2600px;
    animation: rays-in 0.34s var(--pop) 0.48s both, rays-out 0.4s ease-in 3.1s both;
  }
  .rays-pop .rays, .rays-pop .halftone { position: absolute; inset: 0; }
  .rays-pop .rays { animation: spin 9s linear 0.48s infinite both; }
  .rays-pop .halftone {
    --dot: rgb(255 226 120 / 0.4);
    -webkit-mask-image: radial-gradient(circle, #000 10%, transparent 34%);
    mask-image: radial-gradient(circle, #000 10%, transparent 34%);
  }
  .speed { position: absolute; inset: 0; animation: speed 0.26s linear 0.3s both; }
  .speed i { position: absolute; width: 18px; border-radius: 9px; background: linear-gradient(rgb(255 255 255 / 0.95), rgb(255 255 255 / 0)); }
  .mate { position: absolute; left: -60px; top: 510px; width: 1200px; height: 1108px; }
  .layer { position: absolute; inset: 0; transform-origin: 42.3% 86.7%; }
  .mate svg { display: block; }
  .m-rocket { animation: rocket 0.55s linear 0.3s both; }
  .m-exit { animation: exit 0.7s linear 3.1s both; }
  .m-tilt { animation: tilt 0.42s linear 2.36s both; }
  #mate-boo { animation: fade-out 0.05s linear 2.56s both; }
  .m-happy { animation: fade-in 0.14s ease-out 2.4s both; }
  .m-wink { clip-path: inset(23.33% 43.08% 52.5% 43.85%); }
  .sparkle {
    position: absolute; width: 140px; height: 140px; translate: -50% -50%;
    animation: twinkle 0.4s linear var(--t) both, fade-out 0.22s ease-in 2.98s both;
  }
  .sparkle.small { width: 80px; height: 80px; }
  .sparkle i {
    position: absolute; inset: 0; background: var(--ink);
    clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
  }
  .sparkle i + i { inset: 12px; background: #fffbe0; }
  .sparkle.small i + i { inset: 8px; }
  .boo {
    position: absolute; left: 100px; top: 235px; width: 880px; height: 560px; rotate: -6deg;
    animation: boo-slam 0.4s linear 0.7s both, boo-out 0.3s ease-in 3.1s both;
  }
  .boo-jit { position: absolute; inset: 0; animation: jitter 0.12s linear 1.1s 4 both; }
  .boo .burst { position: absolute; inset: 0; }
  .boo .b-shadow { background: var(--ink); translate: 18px 18px; }
  .boo .b-ink { background: var(--ink); }
  .boo .b-fill { inset: 14px; background: var(--white); }
  .boo-text {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 220px; line-height: 1; color: var(--alarm);
    -webkit-text-stroke: 14px var(--ink); filter: drop-shadow(10px 10px 0 var(--ink));
  }
  .cap-row { position: absolute; left: 0; right: 0; bottom: 260px; display: flex; justify-content: center; }
  .cap {
    padding: 14px 28px 20px; background: #fff1a6; font-size: 64px; line-height: 1.25; white-space: nowrap; rotate: -1.5deg;
    animation: pop-in 0.36s var(--pop) 1.5s both, cap-out 0.3s ease-in 3.1s both;
  }
  .flash { background: var(--white); animation: flash 0.3s ease-out 0.5s both; }
  .shake-a { animation: shake8 0.28s linear 0.5s both; }
  .shake-b { animation: shake 0.2s linear 0.86s both; }
  @keyframes flinch {
    0% { transform: translate(0, 0) rotate(0deg); animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1); }
    14% { transform: translate(var(--fx), -26px) rotate(var(--fr)); animation-timing-function: ease-in-out; }
    42% { transform: translate(0, 6px) rotate(0deg); animation-timing-function: ease-out; }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes rays-in { 0% { opacity: 0; transform: scale(0.2); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes rays-out { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.6); } }
  @keyframes speed { 0% { opacity: 0; transform: translateY(700px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-500px); } }
  @keyframes rocket {
    0% { transform: translateY(1400px) scale(0.78, 1.35); animation-timing-function: cubic-bezier(0.15, 0.85, 0.35, 1); }
    24% { transform: translateY(-110px) scale(0.86, 1.28); animation-timing-function: cubic-bezier(0.55, 0, 0.9, 0.5); }
    36% { transform: translateY(0) scale(0.92, 1.18); animation-timing-function: cubic-bezier(0.2, 0.8, 0.3, 1); }
    42% { transform: translateY(0) scale(1.3, 0.75); animation-timing-function: ease-in-out; }
    60% { transform: translateY(0) scale(0.9, 1.12); animation-timing-function: ease-in-out; }
    78% { transform: translateY(0) scale(1.05, 0.96); animation-timing-function: ease-in-out; }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes flash { 0% { opacity: 0; } 12% { opacity: 0.85; } 100% { opacity: 0; } }
  @keyframes shake8 {
    0%, 100% { transform: translate(0, 0); } 12% { transform: translate(-8px, 6px); }
    25% { transform: translate(8px, -6px); } 37% { transform: translate(-7px, -4px); }
    50% { transform: translate(6px, 5px); } 62% { transform: translate(-5px, 3px); }
    75% { transform: translate(4px, -3px); } 87% { transform: translate(-2px, 1px); }
  }
  @keyframes boo-slam {
    0% { opacity: 0; transform: scale(0) rotate(-24deg); animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1); }
    35% { opacity: 1; transform: scale(1.6) rotate(8deg); animation-timing-function: cubic-bezier(0.5, 0, 0.6, 1); }
    62% { transform: scale(0.88) rotate(-3deg); animation-timing-function: ease-out; }
    82% { transform: scale(1.06) rotate(1deg); animation-timing-function: ease-in-out; }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes jitter {
    0%, 49.9% { transform: rotate(-2deg) scale(1.03); }
    50%, 99.9% { transform: rotate(2deg) scale(0.98); } 100% { transform: rotate(0deg) scale(1); }
  }
  @keyframes boo-out { 0% { opacity: 1; transform: scale(1) rotate(0deg); } 100% { opacity: 0; transform: scale(0.4) rotate(12deg); } }
  @keyframes cap-out { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(80px) scale(0.85); } }
  @keyframes tilt {
    0% { transform: rotate(0deg) scale(1, 1); animation-timing-function: ease-out; }
    28% { transform: rotate(2deg) scale(1.07, 0.92); animation-timing-function: ease-in-out; }
    62% { transform: rotate(-9deg) scale(0.97, 1.05); animation-timing-function: ease-in-out; }
    100% { transform: rotate(-6deg) scale(1, 1); }
  }
  @keyframes twinkle {
    0% { opacity: 0; transform: scale(0) rotate(-120deg); animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1); }
    55% { opacity: 1; transform: scale(1.25) rotate(10deg); animation-timing-function: ease-in-out; }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes exit {
    0% { transform: translateY(0) scale(1, 1); animation-timing-function: ease-out; }
    18% { transform: translateY(0) scale(1.12, 0.86); animation-timing-function: ease-out; }
    36% { transform: translateY(-60px) scale(0.9, 1.12); animation-timing-function: cubic-bezier(0.55, 0, 0.9, 0.45); }
    100% { transform: translateY(1300px) scale(0.3, 0.38); }
  }
</style>
</head>
<body>
<script>if (location.search.includes('render=1')) document.documentElement.classList.add('render');</script>

</div>
