<!DOCTYPE html>
<html lang="en">
<head>
<meta name="clip" content="duration=3;fps=60;width=1920;height=1080;alpha=0">
<link rel="stylesheet" href="_kit.css">
<script src="../../assets/art/src/mate-lib.js"></script>
<style>
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden;
               background: var(--paper, #F6EFDF); }
  .stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
           font-family: var(--comic, "Comic Sans MS", "Comic Neue", cursive);
           color: var(--ink, #1F2A44); }
  .bg-dots { position: absolute; inset: 0; opacity: .55; }

  .window { position: absolute; left: 200px; top: 300px; width: 1520px; height: 440px;
            background: #FFFDF6; border: 8px solid var(--ink, #1F2A44); border-radius: 22px;
            box-shadow: 14px 14px 0 rgba(31, 42, 68, .35);
            animation: win-pop .3s 0s both; }
  .titlebar { position: absolute; left: 0; top: 0; width: 1520px; height: 80px;
              background: var(--ink, #1F2A44); border-radius: 14px 14px 0 0; }
  .dot { position: absolute; top: 27px; width: 26px; height: 26px; border-radius: 50%; }
  .dot.d1 { left: 1440px; background: var(--alarm, #E23B2E); }
  .dot.d2 { left: 1398px; background: var(--bulb, #FFD34D); }
  .dot.d3 { left: 1356px; background: #FFFDF6; }

  .btn { position: absolute; top: 240px; width: 150px; height: 150px;
         background: #FFFFFF; border: 7px solid var(--ink, #1F2A44); border-radius: 18px;
         box-shadow: 8px 8px 0 rgba(31, 42, 68, .3);
         display: flex; align-items: center; justify-content: center;
         animation: btn-pop .3s both; }
  .btn .ic { display: block; }

  .btn.b1 { left: 235px; animation-delay: .12s; }
  .btn.b2 { left: 415px; animation-delay: .18s; }
  .btn.b3 { left: 595px; animation-delay: .24s; }
  .btn.b4 { left: 775px; animation-delay: .3s; }
  .btn.b5 { left: 955px; animation-delay: .36s; }
  .btn.b6 { left: 1135px; animation-delay: .42s; }

  .ic-circle { width: 46px; height: 46px; border-radius: 50%; background: var(--ink, #1F2A44); }
  .ic-square { width: 44px; height: 44px; background: var(--ink, #1F2A44); }
  .ic-tri { width: 0; height: 0; border-left: 26px solid transparent;
            border-right: 26px solid transparent; border-bottom: 46px solid var(--ink, #1F2A44); }
  .ic-diamond { width: 38px; height: 38px; background: var(--ink, #1F2A44); transform: rotate(45deg); }
  .ic-plus { position: relative; width: 48px; height: 48px; }
  .ic-plus::before { content: ""; position: absolute; left: 0; top: 19px; width: 48px; height: 10px;
                     background: var(--ink, #1F2A44); }
  .ic-plus::after { content: ""; position: absolute; left: 19px; top: 0; width: 10px; height: 48px;
                    background: var(--ink, #1F2A44); }
  .ic-ring { width: 48px; height: 48px; border-radius: 50%; border: 11px solid var(--ink, #1F2A44); }

  .mate { position: absolute; left: 70px; top: 690px; width: 250px; height: 250px; z-index: 4;
          animation: mate-sweep .9s .2s both; }

  .glow { position: absolute; left: 465px; top: 565px; width: 90px; height: 90px; z-index: 3;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(255, 211, 77, .95) 0%, rgba(255, 211, 77, 0) 70%);
          animation: glow-sweep .9s .2s both; }

  .ring { position: absolute; left: 955px; top: 515px; width: 190px; height: 190px; z-index: 5;
          border: 10px solid var(--bulb, #FFD34D); border-radius: 26px;
          box-shadow: 0 0 30px rgba(255, 211, 77, .9), inset 0 0 22px rgba(255, 211, 77, .6);
          box-sizing: border-box;
          animation: ring-pop .35s 1.2s both; }

  .burst-nice { position: absolute; left: 1130px; top: 420px; z-index: 6;
                width: 300px; height: 190px; display: grid; place-items: center;
                font-size: 72px; font-weight: 900;
                animation: nice-pop .35s 1.3s both; }
  .nice-star { position: absolute; inset: 0; background: var(--bulb, #FFD34D); }
  .nice-text { position: relative; color: var(--white, #fff); -webkit-text-stroke: 5px var(--ink, #1F2A44); }

  .counter { display: none; position: absolute; left: 1636px; top: 150px; width: 140px; height: 110px; z-index: 7;
             font-size: 84px; font-weight: 900; line-height: 110px; text-align: center; }
  .counter span { position: absolute; left: 0; top: 0; width: 140px;
                  animation: digit-step .05s 0s both; }

  .stat { position: absolute; left: 0; right: 0; top: 70px; z-index: 7;
          font-size: 150px; font-weight: 900; text-align: center;
          text-shadow: 6px 6px 0 rgba(31, 42, 68, .25);
          animation: stat-slam .4s 1.6s both; }

  .line { position: absolute; left: 0; right: 0; top: 930px; z-index: 7; text-align: center;
          font-size: 72px; font-weight: 700;
          animation: fade-in .5s 2s both; }

  @keyframes win-pop {
    0% { opacity: 0; transform: scale(.92); }
    65% { opacity: 1; transform: scale(1.02); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes btn-pop {
    0% { opacity: 0; transform: scale(.4); }
    70% { opacity: 1; transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes mate-sweep {
    0% { transform: translateX(0); animation-timing-function: ease-in-out; }
    15% { transform: translateX(0); animation-timing-function: ease-in-out; }
    23% { transform: translateX(180px); animation-timing-function: ease-in-out; }
    38% { transform: translateX(180px); animation-timing-function: ease-in-out; }
    46% { transform: translateX(360px); animation-timing-function: ease-in-out; }
    61% { transform: translateX(360px); animation-timing-function: ease-in-out; }
    72% { transform: translateX(540px); animation-timing-function: ease-in-out; }
    100% { transform: translateX(540px); }
  }
  @keyframes glow-sweep {
    0% { opacity: 0; transform: translateX(0); animation-timing-function: ease-in-out; }
    4% { opacity: 1; transform: translateX(0); animation-timing-function: ease-in-out; }
    15% { transform: translateX(0); animation-timing-function: ease-in-out; }
    23% { transform: translateX(180px); animation-timing-function: ease-in-out; }
    38% { transform: translateX(180px); animation-timing-function: ease-in-out; }
    46% { transform: translateX(360px); animation-timing-function: ease-in-out; }
    61% { transform: translateX(360px); animation-timing-function: ease-in-out; }
    72% { transform: translateX(540px); animation-timing-function: ease-in-out; }
    100% { opacity: 1; transform: translateX(540px); }
  }
  @keyframes ring-pop {
    0% { opacity: 0; transform: scale(.3); }
    60% { opacity: 1; transform: scale(1.18); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes nice-pop {
    0% { opacity: 0; transform: scale(0) rotate(-10deg); }
    60% { opacity: 1; transform: scale(1.2) rotate(4deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes digit-step {
    0% { opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes stat-slam {
    0% { opacity: 0; transform: scale(2.2); }
    55% { opacity: 1; transform: scale(.9); }
    100% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
<script>if (location.search.includes('render=1')) document.documentElement.classList.add('render');</script>
<div class="stage">
  <div class="halftone bg-dots"></div>

  <div class="window">
    <div class="titlebar"></div>
    <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
    <div class="btn b1"><span class="ic ic-circle"></span></div>
    <div class="btn b2"><span class="ic ic-square"></span></div>
    <div class="btn b3"><span class="ic ic-tri"></span></div>
    <div class="btn b4"><span class="ic ic-diamond"></span></div>
    <div class="btn b5"><span class="ic ic-plus"></span></div>
    <div class="btn b6"><span class="ic ic-ring"></span></div>
  </div>

  <div class="glow"></div>
  <div class="mate" id="mate"></div>
  <div class="ring"></div>
  <div class="burst-nice"><div class="nice-star burst"></div><span class="nice-text shout">NICE!</span></div>

  <div class="counter">
    <span style="animation-delay:1s">600</span>
    <span style="animation-delay:1.05s">601</span>
    <span style="animation-delay:1.1s">602</span>
    <span style="animation-delay:1.15s">603</span>
    <span style="animation-delay:1.2s">604</span>
    <span style="animation-delay:1.25s">605</span>
    <span style="animation-delay:1.3s">606</span>
    <span style="animation-delay:1.35s">607</span>
    <span style="animation-delay:1.4s">608</span>
    <span style="animation-delay:1.45s">609</span>
    <span style="animation-delay:1.5s">610</span>
  </div>

  <div class="stat shout">610 / 610</div>
  <div class="line">He finds the right button.</div>
</div>
<script>
  document.getElementById('mate').innerHTML = mate({ eyes: 'open', mouth: 'grin', arm: 'point', glow: true, size: 250 });
</script>
</body>
</html>
