<!doctype html>
<!-- Settings window (WP24): src/settings.ts and its sections in src/settings/. The Home
     window's look from src/theme.css: the same palette, type scale, cards, buttons and focus
     rings. A warm header with Mate's bulb, then six sections (src/settings/sections-view.ts),
     each a comic caption with a small picture over its cards, one card per setting. Short
     choices are segments on one row that wraps when the window is narrow; only the model
     choice, whose options each have a description, keeps a whole card per option. The chosen
     option is Mate's yellow with navy words and a lifted shadow in both themes; on/off
     settings are switches in plain rows. Sized for the 560x720 window, works from 360px
     wide. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      /* The page scrolls: a stable gutter keeps the cards still when it starts to. */
      html {
        scrollbar-gutter: stable;
      }

      html,
      body {
        min-height: 100%;
      }

      #settings-app {
        width: min(100%, 640px);
        margin: 0 auto;
        padding: var(--space-4) var(--panel-pad-x) var(--space-6);
      }

      /* The title and the saved note beside Mate's bulb, in the Home window's warm header. */
      .settings-header {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        margin-bottom: var(--space-6);
        padding: var(--panel-pad);
        background: var(--surface);
        border: var(--ink-width) solid var(--panel-ink);
        border-radius: var(--radius-lg);
        box-shadow: var(--ink-offset) var(--ink-offset) 0 var(--panel-shadow);
      }

      .settings-header-text {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .settings-title {
        font-family: var(--font-comic);
        margin: 0;
        font-size: var(--text-2xl);
        font-weight: 700;
        line-height: 1.2;
        overflow-wrap: break-word;
      }

      .settings-saved-note {
        position: relative;
        margin: 10px 0 0;
        padding: 10px 12px;
        border: 2px solid var(--panel-ink);
        border-radius: var(--radius);
        background: var(--surface-soft);
        font-size: var(--text-sm);
        line-height: 1.4;
        color: var(--text-muted);
      }

      .settings-saved-note::before {
        content: "";
        position: absolute;
        top: -7px;
        left: 18px;
        width: 10px;
        height: 10px;
        border-top: 2px solid var(--panel-ink);
        border-left: 2px solid var(--panel-ink);
        background: var(--surface-soft);
        transform: rotate(45deg);
      }

      .settings-form {
        display: flex;
        flex-direction: column;
        gap: var(--space-6);
      }

      .settings-section {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
      }

      /* A comic caption over the section's cards: a solid box, never text on the halftone. */
      .settings-section-title {
        align-self: flex-start;
        max-width: 100%;
        display: inline-flex;
        align-items: center;
        gap: var(--space-3);
        margin: 0;
        padding: var(--space-1) var(--space-4) var(--space-1) var(--space-1);
        border: var(--ink-width) solid var(--panel-ink);
        border-radius: var(--radius-sm);
        background: var(--accent-soft);
        color: var(--text);
        font: 700 var(--text-xl) / 1.25 var(--font-comic);
      }

      .settings-section-text {
        min-width: 0;
        overflow-wrap: break-word;
      }

      /* Navy on Mate's yellow in both themes. */
      .settings-section-icon {
        flex: none;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border: 2px solid var(--on-accent);
        border-radius: 50%;
        background: var(--accent);
        color: var(--on-accent);
      }

      .settings-section-icon svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .settings-section-icon .i-paper {
        fill: #fffbe8;
      }

      /* The Updates and For judges cards repeat their section's title: screen readers only. */
      .settings-section .settings-update-title,
      .settings-section .settings-dev-title {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .settings-privacy-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }

      /* One calm green mark per line, as on Home's "What Mate never does". */
      .settings-privacy-line {
        display: flex;
        align-items: flex-start;
        gap: var(--space-3);
        text-wrap: pretty;
      }

      .settings-privacy-line::before {
        content: "\2713" / "";
        flex: none;
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--success-bg);
        color: var(--success-text);
        font-weight: 700;
        line-height: 1;
      }

      /* Each setting is a card like the Home window's. */
      .settings-group {
        min-width: 0;
        margin: 0;
        padding: var(--panel-pad);
        background: var(--surface);
        border: var(--ink-width) solid var(--panel-ink);
        border-radius: var(--radius-lg);
        box-shadow: var(--ink-offset) var(--ink-offset) 0 var(--panel-shadow);
      }

      .settings-legend,
      .settings-label,
      .settings-account-title,
      .settings-update-title,
      .settings-dev-title {
        margin: 0;
        font-family: var(--font);
        font-size: var(--text-lg);
        font-weight: 700;
        line-height: 1.3;
        color: var(--text);
      }

      /* Inside the card like a Home section title, not on its border: a floated legend is
         laid out as content and still names its fieldset. */
      .settings-legend {
        float: left;
        width: 100%;
        padding: 0;
        margin-bottom: 10px;
      }

      .settings-legend + * {
        clear: both;
      }

      .settings-options {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* Each choice is a whole option to click: a choice with a description (the model) is a
         card at least as tall as a button, a short one a pill (below) in the same colours. */
      .settings-radio-option,
      .settings-segment {
        display: flex;
        align-items: flex-start;
        gap: var(--space-3);
        min-height: 52px;
        padding: var(--space-3) var(--space-4);
        border: var(--ink-width) solid var(--panel-ink);
        border-radius: var(--radius);
        background: var(--surface-soft);
        cursor: pointer;
        transition:
          background-color 140ms ease-out,
          border-color 140ms ease-out;
      }

      /* Short choices side by side on one row, sharing its width; they wrap on a narrow window.
         The gap leaves room for the chosen one's shadow. */
      .settings-segments {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
      }

      /* A pill to click, at least 44px tall for an unsteady hand. Its radio stays in the page
         for the keyboard and screen readers, see-through over the whole pill; the fill, the
         check mark and the shadow show the choice. */
      .settings-segment {
        position: relative;
        flex: 1 1 auto;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 6px 14px;
        border-radius: var(--radius-sm);
        text-align: center;
      }

      .settings-radio-option:hover,
      .settings-segment:hover {
        background: var(--surface-hover);
      }

      .settings-segment::before {
        content: "";
        flex: none;
        width: 1em;
      }

      .settings-segment.is-selected::before {
        content: "\2713" / "";
        font-weight: 800;
      }

      /* The chosen option: Mate's yellow with navy words and a lifted shadow, the same in both
         themes and on Home's brain cards. */
      .settings-radio-option.is-selected,
      .settings-segment.is-selected {
        border-color: var(--on-accent);
        background: var(--accent);
        color: var(--on-accent);
        box-shadow: var(--ink-offset-sm) var(--ink-offset-sm) 0 var(--panel-shadow);
      }

      .settings-radio-option.is-selected:hover,
      .settings-segment.is-selected:hover {
        background: var(--accent-hover);
      }

      .settings-radio-option.is-selected .option-hint {
        color: var(--on-accent);
      }

      /* Level with the first line of the title. */
      .settings-radio-option input[type="radio"] {
        flex: none;
        width: 22px;
        height: 22px;
        margin: 1px 0 0;
        accent-color: var(--control);
        cursor: pointer;
      }

      .settings-radio-option.is-selected input[type="radio"] {
        accent-color: var(--on-accent);
      }

      .settings-segment input[type="radio"] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }

      .settings-segment .option-title {
        line-height: 1.3;
      }

      /* The chosen segment's description, one line under the row (src/settings/controls.ts
         hides the others). No display here: it would show a hidden one. */
      .settings-segment-hints {
        margin-top: 8px;
        font-size: var(--text-sm);
        line-height: 1.45;
        color: var(--text-muted);
      }

      /* An on/off setting: a plain row, its words first, the switch at the end, as in Windows
         Settings; the switch itself shows on or off. */
      .settings-checkbox-option {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        padding: 6px 8px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: background-color 140ms ease-out;
      }

      .settings-checkbox-option + .settings-checkbox-option {
        border-top: 1px solid var(--border);
      }

      .settings-checkbox-option:hover {
        background: var(--surface-hover);
      }

      .settings-checkbox-option .switch {
        order: 1;
      }

      .settings-checkbox-option .option-text {
        flex: 1 1 auto;
      }

      .option-text {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .option-title {
        font-size: var(--text-md);
        font-weight: 600;
        line-height: 1.5;
        overflow-wrap: break-word;
      }

      .option-hint {
        font-size: var(--text-sm);
        line-height: 1.45;
        color: var(--text-muted);
      }

      .settings-range-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 12px;
        margin-bottom: 6px;
      }

      /* The speed in a pill as wide as its widest value: the label never moves. */
      .settings-range-output {
        min-width: 4.5em;
        padding: 2px 12px;
        border: 1px solid var(--accent-soft-border);
        border-radius: 999px;
        background: var(--accent-soft);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-align: center;
        color: var(--text);
      }

      .settings-range-input {
        display: block;
        min-width: 0;
        width: 100%;
        height: 44px;
        margin: 0;
        appearance: none;
        border-radius: 999px;
        background: transparent;
        accent-color: var(--control);
        cursor: pointer;
      }

      .settings-range-input::-webkit-slider-runnable-track {
        height: 8px;
        border-radius: 999px;
        background: var(--border-strong);
      }

      /* The thumb is a little bulb: yellow with Mate's navy rim. */
      .settings-range-input::-webkit-slider-thumb {
        appearance: none;
        width: 28px;
        height: 28px;
        margin-top: -10px;
        border: 2px solid var(--text);
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 4px var(--glow);
      }

      .settings-range-input::-moz-range-track {
        height: 8px;
        border-radius: 999px;
        background: var(--border-strong);
      }

      .settings-range-input::-moz-range-thumb {
        width: 28px;
        height: 28px;
        box-sizing: border-box;
        border: 2px solid var(--text);
        border-radius: 50%;
        background: var(--accent);
      }

      .settings-range-ends {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        justify-content: space-between;
        color: var(--text-muted);
        font-size: var(--text-sm);
      }

      .settings-toggles {
        display: flex;
        flex-direction: column;
      }

      .settings-account-title,
      .settings-update-title,
      .settings-dev-title {
        margin-bottom: 4px;
      }

      .settings-account-why {
        margin: 0;
        font-size: var(--text-sm);
        line-height: 1.45;
        color: var(--text-muted);
      }

      .settings-update-notes {
        margin-top: 4px;
      }

      /* Side by side when both fit, stacked full width when not. */
      .settings-account-buttons,
      .settings-update-buttons,
      .settings-dev-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .settings-dev-buttons[hidden] {
        display: none;
      }

      .settings-account-btn,
      .settings-update-btn,
      .settings-dev-btn {
        flex: 1 1 200px;
      }

      /* Its display (flex or none) is set by src/settings/account-view.ts. */
      .settings-account-signed-in {
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px 16px;
        margin-top: 14px;
      }

      .settings-account-user {
        min-width: 0;
        font-weight: 600;
        overflow-wrap: anywhere;
        color: var(--text);
      }

      .settings-account-status,
      .settings-update-status,
      .settings-dev-status {
        margin-top: 10px;
        font-size: var(--text-sm);
        line-height: 1.45;
        color: var(--text-muted);
      }

      .settings-account-status:empty,
      .settings-update-status:empty,
      .settings-update-status[hidden],
      .settings-dev-status:empty,
      .settings-dev-status[hidden] {
        margin-top: 0;
      }

      .settings-account-status.is-error,
      .settings-update-status.is-error,
      .settings-dev-status.is-error {
        color: var(--error);
        font-weight: 600;
      }

      /* With the keyboard, the ring goes around the whole option rather than the small control
         inside it; Windows contrast themes keep it. */
      .settings-radio-option:has(input:focus-visible),
      .settings-checkbox-option:has(input:focus-visible),
      .settings-segment:has(input:focus-visible) {
        outline: var(--focus-ring);
        outline-offset: var(--focus-offset);
      }

      .settings-radio-option input:focus-visible,
      .settings-checkbox-option input:focus-visible,
      .settings-segment input:focus-visible {
        outline: none;
      }

      @media (max-width: 400px) {
        .settings-radio-option {
          padding-inline: 12px;
          gap: 10px;
        }

        .settings-segment {
          padding-inline: 10px;
        }

        .settings-header {
          gap: 12px;
        }
      }

      /* Windows contrast themes drop the tints: the cards keep a rim, the chosen option a
         Highlight border. */
      @media (forced-colors: active) {
        /* Two rules: WebView2 drops a whole rule that names a -moz- pseudo-element. */
        .settings-range-input::-webkit-slider-runnable-track {
          border: 1px solid CanvasText;
        }
        .settings-range-input::-moz-range-track {
          border: 1px solid CanvasText;
        }
        .settings-header,
        .settings-group {
          border: 1px solid CanvasText;
          box-shadow: none;
        }

        .settings-saved-note::before {
          display: none;
        }

        .settings-section-icon {
          color: CanvasText;
        }

        .settings-section-icon .i-paper {
          fill: Canvas;
        }

        .settings-privacy-line::before {
          border: 1px solid CanvasText;
        }

        .settings-range-input::-webkit-slider-thumb {
          background: Highlight;
          border-color: ButtonText;
        }

        .settings-radio-option.is-selected {
          border-color: Highlight;
        }

        /* A segment shows no radio: the chosen one is filled with the system highlight, and
           its keyboard ring keeps a system colour. */
        .settings-segment.is-selected,
        .settings-segment.is-selected:hover {
          forced-color-adjust: none;
          border-color: Highlight;
          background: Highlight;
          color: HighlightText;
          box-shadow: none;
        }

        .settings-segment:has(input:focus-visible) {
          outline-color: CanvasText;
        }
      }
    </style>
  </head>
  <body class="comic-page">
    <main id="settings-app"></main>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
