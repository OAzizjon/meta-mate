<!doctype html>
<!-- Settings window (WP24): src/settings.ts and its sections in src/settings/. The Home
     window's look from src/theme.css: the same palette, type scale, cards, buttons and focus
     rings. A warm header with Mate's bulb, then one card per setting; every choice is a whole
     card to click, the chosen one tinted and rimmed in gold; on/off settings are switches.
     Short choices sit two to a row when there is room. Sized for the 560x720 window, works
     from 360px wide. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      /* The page scrolls: a stable gutter keeps the cards still when it starts to. */
      html {
        scrollbar-gutter: stable;
      }

      html,
      body {
        min-height: 100%;
      }

      #settings-app {
        width: min(100%, 640px);
        margin: 0 auto;
        padding: 20px clamp(14px, 4vw, 24px) 32px;
      }

      /* The title and the saved note beside Mate's bulb, in the Home window's warm header. */
      .settings-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
        padding: 18px clamp(14px, 4vw, 22px);
        background: var(--hero-bg);
        border: 1px solid var(--hero-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
      }

      .settings-header-text {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .settings-title {
        margin: 0;
        font-size: var(--text-2xl);
        font-weight: 700;
        line-height: 1.2;
        overflow-wrap: break-word;
      }

      .settings-saved-note {
        margin: 0;
        font-size: var(--text-sm);
        line-height: 1.4;
        color: var(--text-muted);
      }

      .settings-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* Each setting is a card like the Home window's. */
      .settings-group {
        min-width: 0;
        margin: 0;
        padding: 18px clamp(14px, 4vw, 20px) 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
      }

      .settings-legend,
      .settings-label,
      .settings-account-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: var(--text-lg);
        font-weight: 700;
        line-height: 1.3;
        color: var(--text);
      }

      /* Inside the card like a Home section title, not on its border: a floated legend is
         laid out as content and still names its fieldset. */
      .settings-legend {
        float: left;
        width: 100%;
        padding: 0;
        margin-bottom: 12px;
      }

      .settings-legend + * {
        clear: both;
      }

      .settings-options {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* Short names (talk keys, sounds, sizes) two to a row when there is room. */
      .settings-options-grid,
      .settings-size-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr));
        gap: 10px;
      }

      /* Each choice is a whole card to click, at least as tall as a button. */
      .settings-radio-option,
      .settings-checkbox-option,
      .settings-size-option {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        min-height: 52px;
        padding: 13px 14px;
        border: 2px solid var(--border-soft);
        border-radius: var(--radius);
        background: var(--surface-soft);
        cursor: pointer;
        transition:
          background-color 140ms ease-out,
          border-color 140ms ease-out;
      }

      .settings-radio-option:hover,
      .settings-checkbox-option:hover,
      .settings-size-option:hover {
        background: var(--surface-hover);
        border-color: var(--border-strong);
      }

      .settings-radio-option.is-selected,
      .settings-checkbox-option.is-selected,
      .settings-size-option.is-selected {
        background: var(--accent-soft);
        border-color: var(--accent-line);
        box-shadow: inset 0 0 0 1px var(--accent-line);
      }

      .settings-radio-option.is-selected:hover,
      .settings-checkbox-option.is-selected:hover,
      .settings-size-option.is-selected:hover {
        background: var(--accent-soft-hover);
      }

      /* Level with the first line of the title. */
      .settings-radio-option input[type="radio"],
      .settings-size-option input[type="radio"] {
        flex: none;
        width: 22px;
        height: 22px;
        margin: 1px 0 0;
        accent-color: var(--control);
        cursor: pointer;
      }

      .settings-size-option,
      .settings-checkbox-option {
        align-items: center;
      }

      .settings-size-option input[type="radio"] {
        margin-top: 0;
      }

      /* An on/off setting: its words first, the switch at the end, as in Windows Settings. */
      .settings-checkbox-option .switch {
        order: 1;
      }

      .settings-checkbox-option .option-text {
        flex: 1 1 auto;
      }

      .option-text {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .option-title {
        font-size: var(--text-md);
        font-weight: 600;
        line-height: 1.5;
        overflow-wrap: break-word;
      }

      .option-hint {
        font-size: var(--text-sm);
        line-height: 1.45;
        color: var(--text-muted);
      }

      .settings-range-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 12px;
        margin-bottom: 6px;
      }

      /* The speed in a pill as wide as its widest value: the label never moves. */
      .settings-range-output {
        min-width: 4.5em;
        padding: 2px 12px;
        border: 1px solid var(--accent-soft-border);
        border-radius: 999px;
        background: var(--accent-soft);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-align: center;
        color: var(--text);
      }

      .settings-range-input {
        display: block;
        min-width: 0;
        width: 100%;
        height: 44px;
        margin: 0;
        appearance: none;
        border-radius: 999px;
        background: transparent;
        accent-color: var(--control);
        cursor: pointer;
      }

      .settings-range-input::-webkit-slider-runnable-track {
        height: 8px;
        border-radius: 999px;
        background: var(--border-strong);
      }

      /* The thumb is a little bulb: yellow with Mate's navy rim. */
      .settings-range-input::-webkit-slider-thumb {
        appearance: none;
        width: 28px;
        height: 28px;
        margin-top: -10px;
        border: 2px solid var(--text);
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 4px var(--glow);
      }

      .settings-range-input::-moz-range-track {
        height: 8px;
        border-radius: 999px;
        background: var(--border-strong);
      }

      .settings-range-input::-moz-range-thumb {
        width: 28px;
        height: 28px;
        box-sizing: border-box;
        border: 2px solid var(--text);
        border-radius: 50%;
        background: var(--accent);
      }

      .settings-range-ends {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        justify-content: space-between;
        color: var(--text-muted);
        font-size: var(--text-sm);
      }

      .settings-toggles {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .settings-account-title {
        margin-bottom: 4px;
      }

      .settings-account-why {
        margin: 0;
        font-size: var(--text-sm);
        line-height: 1.45;
        color: var(--text-muted);
      }

      /* Side by side when both fit, stacked full width when not. */
      .settings-account-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .settings-account-btn {
        flex: 1 1 200px;
      }

      /* Its display (flex or none) is set by src/settings/account-view.ts. */
      .settings-account-signed-in {
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px 16px;
        margin-top: 14px;
      }

      .settings-account-user {
        min-width: 0;
        font-weight: 600;
        overflow-wrap: anywhere;
        color: var(--text);
      }

      .settings-account-status {
        margin-top: 10px;
        font-size: var(--text-sm);
        line-height: 1.45;
        color: var(--text-muted);
      }

      .settings-account-status:empty {
        margin-top: 0;
      }

      .settings-account-status.is-error {
        color: var(--error);
        font-weight: 600;
      }

      /* With the keyboard, the ring goes around the whole option rather than the small control
         inside it; Windows contrast themes keep it. */
      .settings-radio-option:has(input:focus-visible),
      .settings-checkbox-option:has(input:focus-visible),
      .settings-size-option:has(input:focus-visible) {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .settings-radio-option input:focus-visible,
      .settings-checkbox-option input:focus-visible,
      .settings-size-option input:focus-visible {
        outline: none;
      }

      @media (max-width: 400px) {
        .settings-radio-option,
        .settings-checkbox-option,
        .settings-size-option {
          padding-inline: 12px;
          gap: 10px;
        }

        .settings-header {
          gap: 12px;
        }
      }

      /* Windows contrast themes drop the tints: the cards keep a rim, the chosen option a
         Highlight border. */
      @media (forced-colors: active) {
        /* Two rules: WebView2 drops a whole rule that names a -moz- pseudo-element. */
        .settings-range-input::-webkit-slider-runnable-track {
          border: 1px solid CanvasText;
        }
        .settings-range-input::-moz-range-track {
          border: 1px solid CanvasText;
        }
        .settings-header,
        .settings-group {
          border: 1px solid CanvasText;
        }

        .settings-range-input::-webkit-slider-thumb {
          background: Highlight;
          border-color: ButtonText;
        }

        .settings-radio-option.is-selected,
        .settings-checkbox-option.is-selected,
        .settings-size-option.is-selected {
          border-color: Highlight;
        }
      }
    </style>
  </head>
  <body>
    <main id="settings-app"></main>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
