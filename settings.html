<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fffdf7;
        --card-bg: #ffffff;
        --card-border: #d0d8e5;
        --text: #1f2a44;
        --text-muted: #475569;
        --accent: #1d4ed8;
        --accent-soft: #eff6ff;
        --accent-border: #3b82f6;
        --option-bg: #f8fafc;
        --option-hover: #f1f5f9;
        --shadow: 0 2px 8px rgba(31, 42, 68, 0.08);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131722;
          --card-bg: #1c2230;
          --card-border: #2e384d;
          --text: #f1f5f9;
          --text-muted: #cbd5e1;
          --accent: #ffd23f;
          --accent-soft: #252f42;
          --accent-border: #ffd23f;
          --option-bg: #22293a;
          --option-hover: #2a3347;
          --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 18px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      #settings-app {
        max-width: 640px;
        margin: 0 auto;
        padding: 24px 20px 40px;
      }

      .settings-header {
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--card-border);
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px 16px;
      }

      .settings-title {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        line-height: 1.25;
      }

      .settings-language-note {
        margin: 0;
        font-size: 16px;
        color: var(--text-muted);
      }

      .settings-form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .settings-group {
        margin: 0;
        padding: 18px 20px;
        background: var(--card-bg);
        border: 2px solid var(--card-border);
        border-radius: 14px;
        box-shadow: var(--shadow);
      }

      fieldset.settings-group {
        min-width: 0;
      }

      .settings-legend,
      .settings-label {
        font-size: 20px;
        font-weight: 700;
        line-height: 1.3;
        color: var(--text);
      }

      .settings-legend {
        padding: 0 6px;
        margin-bottom: 10px;
      }

      .settings-options {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .settings-radio-option,
      .settings-checkbox-option,
      .settings-size-option {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        min-height: 52px;
        padding: 12px 14px;
        border-radius: 10px;
        border: 2px solid var(--card-border);
        background: var(--option-bg);
        cursor: pointer;
        transition:
          background-color 120ms ease-out,
          border-color 120ms ease-out;
      }

      .settings-radio-option:hover,
      .settings-checkbox-option:hover,
      .settings-size-option:hover {
        background: var(--option-hover);
      }

      .settings-radio-option.is-selected,
      .settings-checkbox-option.is-selected,
      .settings-size-option.is-selected {
        background: var(--accent-soft);
        border-color: var(--accent-border);
      }

      .settings-radio-option input[type="radio"],
      .settings-checkbox-option input[type="checkbox"],
      .settings-size-option input[type="radio"] {
        width: 22px;
        height: 22px;
        margin: 3px 0 0 0;
        flex-shrink: 0;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .option-text {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .option-title {
        font-size: 18px;
        font-weight: 600;
        line-height: 1.35;
      }

      .option-hint {
        font-size: 16px;
        color: var(--text-muted);
        line-height: 1.4;
      }

      .settings-size-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .settings-size-option {
        align-items: center;
        justify-content: center;
        padding: 12px 10px;
      }

      .settings-range-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .settings-range-output {
        font-size: 20px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }

      .settings-range-input {
        width: 100%;
        height: 36px;
        margin: 0;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .settings-toggles {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      input:focus-visible,
      .settings-radio-option:focus-within,
      .settings-checkbox-option:focus-within,
      .settings-size-option:focus-within {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      .reduce-motion *,
      .reduce-motion *::before,
      .reduce-motion *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="settings-app"></main>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
