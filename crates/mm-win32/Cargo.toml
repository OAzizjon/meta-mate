[package]
name = "mm-win32"
description = "MetaMate's Windows layer: no-focus overlay windows, Per-Monitor DPI v2, monitors, the foreground window, the push-to-talk keyboard hook. The only crate that calls Win32."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mm-core.workspace = true
mm-platform = { path = "../mm-platform" }

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
