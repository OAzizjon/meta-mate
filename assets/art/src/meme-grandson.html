<!doctype html>
<!-- size: 1080x1080 -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; }
  body { width: 1080px; height: 1080px; display: grid; grid-template-rows: 1fr 1fr; font-family: 'Segoe UI', Arial, sans-serif; }
  .panel { position: relative; overflow: hidden; border-bottom: 6px solid #1F2A44; }
  .one { background: #E7E3F4; } .two { background: #FFF1CC; border-bottom: 0; }
  .label { position: absolute; left: 36px; top: 26px; font-family: Impact, 'Arial Black', sans-serif; font-size: 56px; color: #fff;
           -webkit-text-stroke: 4px #000; paint-order: stroke fill; text-transform: uppercase; }
  .bubble { position: absolute; background: #fff; border: 5px solid #1F2A44; border-radius: 34px; padding: 26px 34px;
            font-size: 40px; font-weight: 700; color: #1F2A44; line-height: 1.2; }
  .one .bubble { left: 300px; top: 120px; width: 640px; }
  .phone { position: absolute; left: 70px; top: 150px; width: 170px; height: 300px; background: #1F2A44; border-radius: 30px; }
  .phone::after { content: ''; position: absolute; inset: 18px 14px 40px; background: #8FB4D9; border-radius: 14px; }
  .waves { position: absolute; left: 238px; top: 210px; font-size: 70px; color: #1F2A44; font-weight: 900; }
  .two .bubble { left: 50px; top: 150px; width: 420px; font-size: 38px; font-style: italic; }
  .mate { position: absolute; right: 70px; top: 30px; transform: rotate(-10deg); }
  .speed { position: absolute; right: 462px; top: 250px; }
  .speed i { display: block; height: 10px; background: #1F2A44; border-radius: 5px; margin: 26px 0; opacity: .5; }
</style></head>
<body>
  <div class="panel one">
    <div class="label">Grandson on the phone</div>
    <div class="phone"></div><div class="waves">)))</div>
    <div class="bubble">"Click the gear. Top right. No… your <u>other</u> right. The other gear. Grandma, what do you see now?"</div>
  </div>
  <div class="panel two">
    <div class="label">Mate</div>
    <div class="bubble">*flies over and points at it*<br><br>"Right here. Well done!"</div>
    <div class="speed"><i style="width:40px"></i><i style="width:56px"></i><i style="width:32px"></i></div>
    <div class="mate" id="mate"></div>
  </div>
<script src="mate-lib.js"></script>
<script>document.getElementById('mate').innerHTML = mate({ eyes: 'happy', arm: 'point', mouth: 'grin', size: 450 });</script>
</body></html>
