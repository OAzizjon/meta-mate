<!doctype html>
<!-- size: 1800x720 -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; }
  body { width: 1800px; height: 720px; background: #FBF7EF; font-family: 'Segoe UI', Arial, sans-serif; color: #1F2A44; }
  h1 { margin: 0; padding: 36px 60px 0; font-size: 56px; font-weight: 800; letter-spacing: -1px; }
  h1 span { color: #C98A00; }
  p.sub { margin: 6px 60px 0; font-size: 23px; opacity: .7; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 26px 50px 0; }
  .card { background: #fff; border: 4px solid #1F2A44; border-radius: 28px; padding: 14px 18px 18px; text-align: center; }
  .tag { display: inline-block; background: #1F2A44; color: #fff; font-weight: 800; border-radius: 12px; padding: 2px 14px; font-size: 24px; }
  h2 { margin: 6px 0 0; font-size: 32px; }
  .card p { margin: 6px 10px 0; font-size: 19px; line-height: 1.3; opacity: .75; min-height: 50px; }
  .poses { display: flex; justify-content: center; align-items: flex-end; gap: 2px; margin-top: 8px; }
  .poses div { font-size: 15px; opacity: .6; }
  .small { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 10px; padding: 8px; border-radius: 16px;
           background: repeating-linear-gradient(45deg, #E8EEF5 0 12px, #DDE5EF 12px 24px); }
  .small span { font-size: 15px; opacity: .6; }
  .small .dark { background: #1F2A44; border-radius: 10px; padding: 4px 8px; display: flex; gap: 10px; align-items: center; }
</style></head>
<body>
  <h1>Mate the <span>bulb</span>: three refinements</h1>
  <p class="sub">Each card: idle · pointing (the beam is the highlight) · proud. Strip: 64 / 40 px on light and dark screens.</p>
  <div class="grid" id="grid"></div>
<script src="mate-lib.js"></script>
<script src="bulb.js"></script>
<script>
  document.getElementById('grid').innerHTML = BULB_VARIANTS.map(([tag, name, v, line]) => `
    <div class="card">
      <span class="tag">${tag}</span><h2>${name}</h2><p>${line}</p>
      <div class="poses">
        <div>${bulbMate(v, { size: 150 })}<br>idle</div>
        <div>${bulbMate(v, { arm: 'point', eyes: 'open', size: 190 })}<br>pointing</div>
        <div>${bulbMate(v, { eyes: 'happy', mouth: 'grin', glow: true, size: 130 })}<br>proud</div>
      </div>
      <div class="small">${bulbMate(v, { size: 64 })}${bulbMate(v, { size: 40 })}
        <div class="dark">${bulbMate(v, { size: 64 })}${bulbMate(v, { size: 40 })}</div><span>64 / 40 px</span></div>
    </div>`).join('');
</script>
</body></html>
