<!doctype html>
<!-- size: 1280x720 -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: #1B2638; }
  canvas { display: block; image-rendering: pixelated; }
</style></head>
<body><canvas id="c"></canvas>
<script src="mate-lib.js"></script>
<script>
  // 160 x 90 art pixels, 8 screen pixels each.
  const px = pixelCanvas('c', 160, 90, 8);
  px.rect(0, 0, 160, 90, '#1B2638');
  // starfield
  [[7, 6], [22, 15], [41, 4], [63, 11], [88, 5], [104, 14], [127, 7], [149, 12], [12, 80], [151, 83], [80, 86]]
    .forEach(([x, y]) => px.dot(x, y, '#5B6E8C'));
  const title = 'MATE';
  px.text(title, Math.round((160 - px.textWidth(title, 2)) / 2), 6, '#FFC94A', 2);
  const sub = 'YOUR SCREEN BUDDY';
  px.text(sub, Math.round((160 - px.textWidth(sub)) / 2), 24, '#8FF5E9');

  const frames = [['idle', 'IDLE'], ['listen', 'LISTEN'], ['point', 'POINT'], ['happy', 'HAPPY']];
  frames.forEach(([pose, label], i) => {
    const x0 = 6 + i * 38, y0 = 38;
    px.rect(x0, y0 - 2, 34, 30, '#24344D');
    const g = mateGrid(pose === 'point' ? 'idle' : pose);
    px.grid(g, x0 + 1, y0, false);
    if (pose === 'point') {
      // The arm sticks out of the frame a little, like it's reaching for a button.
      armCells(3).forEach(([x, y, ch]) => px.dot(x0 + 1 + x, y0 + y, PAL[ch]));
      px.tri(x0 + 28, y0 + 12, x0 + 34, y0 + 7, x0 + 34, y0 + 17, 'rgba(255,233,168,0.85)');
    }
    px.text(label, x0 + Math.round((34 - px.textWidth(label)) / 2), y0 + 31, '#F4EEE2');
  });
  const foot = 'PRESS AND HOLD TO TALK';
  px.text(foot, Math.round((160 - px.textWidth(foot)) / 2), 80, '#5B6E8C');
</script>
</body></html>
