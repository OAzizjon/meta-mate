<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      :root { color-scheme: light dark; --bg: #f4f6fa; --panel: #fff; --text: #1f2a44; --person: #fff0ae; --edge: #69758b; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 19px/1.5 "Segoe UI", system-ui, sans-serif; }
      #chat-app { height: 100%; display: flex; flex-direction: column; }
      header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
      h1 { margin: 0; font-size: 24px; }
      button, textarea { font: inherit; color: inherit; border: 2px solid var(--edge); border-radius: 10px; background: var(--panel); }
      button { min-height: 52px; padding: 10px 18px; cursor: pointer; }
      button:disabled { opacity: .6; cursor: default; }
      :focus-visible { outline: 3px solid #2878d0; outline-offset: 3px; }
      #messages { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 16px; list-style: none; }
      .message { width: fit-content; max-width: 90%; margin: 0 auto 14px 0; padding: 12px 16px; border: 1px solid var(--edge); border-radius: 14px; background: var(--panel); overflow-wrap: anywhere; }
      .message.person { margin-left: auto; margin-right: 0; background: var(--person); }
      .message p { margin: 4px 0; white-space: pre-wrap; }
      .message time { display: block; font-size: 16px; }
      form { flex: none; padding: 12px 16px 16px; border-top: 1px solid var(--edge); }
      label { display: block; font-weight: 600; }
      textarea { display: block; width: 100%; min-height: 110px; max-height: 30vh; resize: vertical; padding: 12px; margin: 6px 0 12px; }
      .compose-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
      .compose-actions span { flex: 1; font-size: 16px; }
      #send { background: var(--person); font-weight: 700; min-width: 120px; }
      #status { margin: 0; padding: 0 16px; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #131722; --panel: #222a3a; --text: #f1f5f9; --person: #524414; --edge: #a0acc0; }
      }
      @media (forced-colors: active) {
        .message, button, textarea { border: 2px solid CanvasText; }
        :focus-visible { outline-color: Highlight; }
      }
      /* No animations or smooth scrolling, including when reduced motion is requested. */
      @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
    </style>
  </head>
  <body>
    <main id="chat-app"></main>
    <script type="module" src="/src/chat.ts"></script>
  </body>
</html>
