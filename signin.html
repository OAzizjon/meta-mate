<!doctype html>
<!-- Sign-in window (src-tauri/src/signin.rs, src/signin.ts): signing in is required before
     Mate answers. A welcome column: Mate in his glow, one sentence, the guest trial as the one
     big main button, then the account buttons (Google, GitHub) with a small note on what
     happens next. The Home window's look from src/theme.css. Sized for the 560x600 window,
     works from 360px wide. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      html {
        scrollbar-gutter: stable;
      }

      html,
      body {
        min-height: 100%;
      }

      #signin-app {
        width: min(100%, 520px);
        margin: 0 auto;
        padding: clamp(16px, 4vh, 32px) var(--panel-pad-x) var(--space-6);
        display: flex;
        flex-direction: column;
        gap: var(--space-5);
      }

      /* Mate above the title, centered like a welcome card. */
      .signin-hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-4);
        text-align: center;
      }

      /* Room for the M size (96x89, src/robot/types.ts). */
      .signin-mate {
        flex: none;
        width: 120px;
        height: 108px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 45%, var(--glow) 0%, transparent 70%);
      }

      .signin-words {
        position: relative;
        min-width: 0;
        padding: var(--panel-pad);
        border: var(--ink-width) solid var(--panel-ink);
        border-radius: var(--radius-lg);
        background: var(--surface);
        box-shadow: var(--ink-offset) var(--ink-offset) 0 var(--panel-shadow);
      }

      .signin-words::before {
        content: "";
        position: absolute;
        top: -10px;
        left: calc(50% - 9px);
        width: 16px;
        height: 16px;
        border-top: var(--ink-width) solid var(--panel-ink);
        border-left: var(--ink-width) solid var(--panel-ink);
        background: var(--surface);
        transform: rotate(45deg);
      }

      .signin-title {
        font-family: var(--font-comic);
        margin: 4px 0 6px;
        font-size: var(--text-2xl);
        font-weight: 700;
        line-height: 1.2;
      }

      .signin-intro {
        margin: 0 auto;
        max-width: 36em;
        color: var(--text-muted);
        text-wrap: pretty;
      }

      /* The guest trial and the accounts: two panels, the trial first. */
      .signin-guest,
      .signin-accounts {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        padding: var(--panel-pad);
        border: var(--ink-width) solid var(--panel-ink);
        border-radius: var(--radius-lg);
        background: var(--surface);
        box-shadow: var(--ink-offset) var(--ink-offset) 0 var(--panel-shadow);
        text-align: center;
      }

      .signin-guest[hidden] {
        display: none;
      }

      .signin-guest-line {
        margin: 0;
        font-size: var(--text-sm);
        color: var(--text-muted);
      }

      .signin-buttons {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }

      /* The account buttons: large, equal, white, so neither looks like the "right" one. */
      .signin-btn {
        min-height: 56px;
        font-size: var(--text-lg);
      }

      /* The first choice: the one big yellow button of the window. */
      .signin-btn-guest {
        min-height: 64px;
        font-size: var(--text-xl);
        font-weight: 700;
      }

      /* What happens next: a small line under the account buttons. */
      .signin-browser {
        margin: 0;
        color: var(--text-muted);
        font-size: var(--text-sm);
        line-height: 1.4;
        text-wrap: pretty;
      }

      /* No display when empty: nothing shifts until a line is shown. */
      .signin-status {
        margin: 0;
        padding: 12px 16px;
        border: 1px solid var(--accent-line);
        border-radius: var(--radius);
        background: var(--accent-soft);
        font-weight: 600;
        text-align: center;
      }

      .signin-status:empty {
        display: none;
      }

      .signin-status.is-error {
        color: var(--error);
        border-color: currentColor;
        background: var(--error-soft);
      }

      @media (forced-colors: active) {
        .signin-words,
        .signin-guest,
        .signin-accounts {
          box-shadow: none;
        }

        .signin-words::before {
          display: none;
        }

        .signin-status {
          border: 1px solid CanvasText;
        }
      }
    </style>
  </head>
  <body class="comic-page">
    <main id="signin-app"></main>
    <script type="module" src="/src/signin.ts"></script>
  </body>
</html>
