<!doctype html>
<!-- Sign-in window (src-tauri/src/signin.rs, src/signin.ts): signing in is required before
     Mate answers. A welcome column: Mate in his glow, one sentence, two big buttons (Google,
     GitHub), what happens next, and the guest trial under a divider. The Home window's look
     from src/theme.css. Sized for the 560x600 window, works from 360px wide. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      html {
        scrollbar-gutter: stable;
      }

      html,
      body {
        min-height: 100%;
      }

      #signin-app {
        width: min(100%, 520px);
        margin: 0 auto;
        padding: clamp(16px, 4vh, 32px) clamp(16px, 5vw, 28px) 28px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* Mate above the title, centered like a welcome card. */
      .signin-hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding-bottom: 4px;
        text-align: center;
      }

      /* Room for the M size (96x89, src/robot/types.ts). */
      .signin-mate {
        flex: none;
        width: 120px;
        height: 108px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 45%, var(--glow) 0%, transparent 70%);
      }

      .signin-words {
        min-width: 0;
      }

      .signin-title {
        margin: 4px 0 6px;
        font-size: var(--text-2xl);
        font-weight: 700;
        line-height: 1.2;
      }

      .signin-intro {
        margin: 0 auto;
        max-width: 36em;
        color: var(--text-muted);
        text-wrap: pretty;
      }

      .signin-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* The two ways in: large, equal, white, so neither looks like the "right" one. */
      .signin-btn {
        min-height: 56px;
        font-size: var(--text-lg);
      }

      .signin-buttons .signin-btn {
        box-shadow: var(--shadow-sm);
      }

      .signin-browser {
        margin: 0;
        color: var(--text-muted);
        font-size: var(--text-sm);
        text-align: center;
        text-wrap: pretty;
      }

      .signin-guest {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 4px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        text-align: center;
      }

      .signin-guest[hidden] {
        display: none;
      }

      .signin-guest-line {
        margin: 0;
        font-size: var(--text-sm);
        color: var(--text-muted);
      }

      .signin-btn-quiet {
        min-height: 48px;
        font-size: var(--text-md);
      }

      /* No display when empty: nothing shifts until a line is shown. */
      .signin-status {
        margin: 0;
        padding: 12px 16px;
        border: 1px solid var(--accent-line);
        border-radius: var(--radius);
        background: var(--accent-soft);
        font-weight: 600;
        text-align: center;
      }

      .signin-status:empty {
        display: none;
      }

      .signin-status.is-error {
        color: var(--error);
        border-color: currentColor;
        background: var(--error-soft);
      }

      @media (forced-colors: active) {
        .signin-status {
          border: 1px solid CanvasText;
        }
      }
    </style>
  </head>
  <body>
    <main id="signin-app"></main>
    <script type="module" src="/src/signin.ts"></script>
  </body>
</html>
