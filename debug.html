<!doctype html>
<!-- "Under the hood" window (WP14, D78): opened from Settings > Developer mode.
     Shows the Meta AI pipeline strip, model badges, timeline chips, muted text,
     PCM arrivals per sentence, timings bar chart, and look stats per generation
     (newest on top, keeps last 20). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetaMate · Under the hood</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      :root {
        --bg: #fbf6ea;
        --bg-dot: rgba(31, 42, 68, 0.11);
        --surface: #fffdf7;
        --surface-soft: #f4ecda;
        --surface-muted: #ede3cc;
        --text: #1f2a44;
        --text-soft: #3a4663;
        --text-muted: #5a6580;
        --panel-ink: #1f2a44;
        --panel-shadow: #1f2a44;
        --accent: #ffcd3c;
        --accent-soft: #fff2b8;
        --on-accent: #1f2a44;
        --font-comic: "Comic Neue", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: var(--bg);
        background-image: radial-gradient(var(--bg-dot) 1.25px, transparent 1.25px);
        background-size: 14px 14px;
        color: var(--text);
        font: 600 13px/1.4 var(--font-comic);
      }
      .debug-header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--surface);
        border-bottom: 2.5px solid var(--panel-ink);
        box-shadow: 0 4px 0 var(--panel-shadow);
        padding: 10px 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .debug-header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 6px 14px;
      }
      .debug-header h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.2px;
        color: var(--on-accent);
        background: var(--accent);
        border: 2.5px solid var(--panel-ink);
        border-radius: 10px;
        padding: 3px 10px;
        box-shadow: 3px 3px 0 var(--panel-shadow);
      }
      .debug-privacy {
        margin: 0;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-soft);
      }
      .pipeline-row {
        display: flex;
        align-items: center;
        min-width: 0;
      }
      .pipeline-strip {
        display: flex;
        align-items: center;
        flex-wrap: nowrap;
        gap: 5px;
        width: 100%;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .pipeline-chip {
        display: inline-flex;
        align-items: center;
        padding: 3px 8px;
        background: var(--surface-soft);
        color: var(--text);
        border: 2px solid var(--panel-ink);
        border-radius: 999px;
        box-shadow: 2px 2px 0 var(--panel-shadow);
        font-size: 11.5px;
        font-weight: 800;
        white-space: nowrap;
        line-height: 1.2;
      }
      .pipeline-models {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }
      .pipeline-chip.pipeline-model.is-active {
        background: var(--accent);
        color: var(--on-accent);
        box-shadow: 3px 3px 0 var(--panel-shadow);
        transform: translate(-1px, -1px);
      }
      .pipeline-arrow,
      .pipeline-slash {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 800;
        color: var(--text-muted);
        user-select: none;
      }
      #debug-app {
        max-width: 900px;
        margin: 0 auto;
        padding: 14px 16px 32px;
        box-sizing: border-box;
      }
      .generation-card {
        background: var(--surface);
        border: 2.5px solid var(--panel-ink);
        border-radius: 14px;
        margin-bottom: 14px;
        padding: 12px 15px;
        box-shadow: 4px 4px 0 var(--panel-shadow);
      }
      .generation-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        border-bottom: 2px solid var(--panel-ink);
        padding-bottom: 8px;
        margin-bottom: 10px;
      }
      .generation-title {
        font-size: 15px;
        font-weight: 800;
        color: var(--text);
        margin: 0;
      }
      .generation-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.3px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 2px solid var(--panel-ink);
        box-shadow: 2px 2px 0 var(--panel-shadow);
        line-height: 1.2;
      }
      .badge-model {
        background: var(--accent);
        color: var(--on-accent);
      }
      .badge-state {
        background: #dbeafe;
        color: #1e3a8a;
        text-transform: uppercase;
      }
      .badge-cancelled {
        background: #fee2e2;
        color: #7f1d1d;
        text-transform: uppercase;
      }
      .badge-line {
        background: var(--accent-soft);
        color: var(--on-accent);
      }
      .debug-section {
        margin-top: 10px;
      }
      .section-title {
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
        margin: 0 0 5px 0;
      }
      .look-box {
        background: var(--surface-soft);
        border: 2px solid var(--panel-ink);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
      }
      .timings-chart {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .timing-row {
        display: grid;
        grid-template-columns: 190px 1fr 68px;
        align-items: center;
        gap: 10px;
        font-size: 12px;
      }
      .timing-label {
        display: flex;
        align-items: baseline;
        gap: 6px;
        overflow: hidden;
        white-space: nowrap;
      }
      .timing-plain {
        font-weight: 800;
        color: var(--text);
      }
      .timing-name {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        color: var(--text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .timing-track {
        background: var(--surface-soft);
        border: 2px solid var(--panel-ink);
        border-radius: 999px;
        height: 14px;
        overflow: hidden;
        position: relative;
      }
      .timing-bar {
        background: var(--accent);
        border-right: 2px solid var(--panel-ink);
        height: 100%;
        min-width: 4px;
        transition: width 0.15s ease-out;
      }
      .timing-val {
        text-align: right;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        color: var(--text);
      }
      .timeline-entries {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .timeline-entry {
        background: var(--surface-soft);
        border: 2px solid var(--panel-ink);
        border-radius: 8px;
        padding: 6px 8px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 999px;
        border: 1.5px solid var(--panel-ink);
        box-shadow: 1.5px 1.5px 0 var(--panel-shadow);
        line-height: 1.25;
      }
      .chip-say {
        background: #dbeafe;
        color: #1e3a8a;
      }
      .chip-point {
        background: #ffcd3c;
        color: #1f2a44;
      }
      .chip-pause {
        background: #f3e8ff;
        color: #581c87;
      }
      .chip-end {
        background: #d1fae5;
        color: #065f46;
      }
      .chip-wait {
        background: #e0e7ff;
        color: #312e81;
      }
      .chip-sfx {
        background: #fce7f3;
        color: #831843;
      }
      .chip-amb {
        background: #ccfbf1;
        color: #115e59;
      }
      .chip-mood {
        background: #cffafe;
        color: #155e75;
      }
      .chip-step {
        background: #ffedd5;
        color: #7c2d12;
      }
      .chip-show,
      .chip-open,
      .chip-lang {
        background: #e2e8f0;
        color: #1e293b;
      }
      .chip-point_rejected,
      .chip-bad_tag {
        background: #fee2e2;
        color: #7f1d1d;
      }
      .sentence-text {
        margin: 5px 0 2px 6px;
        font-size: 12.5px;
      }
      .muted {
        color: var(--text-muted);
        font-style: italic;
      }
      .pcm-list {
        margin: 0;
        padding-left: 20px;
        font-size: 12px;
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .pcm-item {
        margin-bottom: 2px;
      }
      .debug-empty {
        text-align: center;
        padding: 48px 20px;
        font-size: 14px;
        background: var(--surface);
        border: 2.5px solid var(--panel-ink);
        border-radius: 14px;
        box-shadow: 4px 4px 0 var(--panel-shadow);
      }
      .debug-empty-gen {
        padding: 6px 0;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header class="debug-header">
      <div class="debug-header-top">
        <h1>MetaMate · Under the hood</h1>
        <p class="debug-privacy">Shown here: timings, models, Mate's own words and counts. Never your words or your screenshot.</p>
      </div>
      <div id="debug-pipeline" class="pipeline-row">
        <div class="pipeline-strip" role="region" aria-label="Meta AI pipeline">
          <span class="pipeline-chip" data-step="voice">Your voice</span>
          <span class="pipeline-arrow" aria-hidden="true">-&gt;</span>
          <span class="pipeline-chip" data-step="asr">Muse Voice Transcribe</span>
          <span class="pipeline-arrow" aria-hidden="true">-&gt;</span>
          <span class="pipeline-models" data-step="model" data-active-model="">
            <span class="pipeline-chip pipeline-model" data-model="muse-spark-1.3">Muse Spark</span>
            <span class="pipeline-slash" aria-hidden="true">/</span>
            <span class="pipeline-chip pipeline-model" data-model="muse-wonder-1.0">Wonder</span>
            <span class="pipeline-slash" aria-hidden="true">/</span>
            <span class="pipeline-chip pipeline-model" data-model="muse-glimmer-30b">Glimmer</span>
          </span>
          <span class="pipeline-arrow" aria-hidden="true">-&gt;</span>
          <span class="pipeline-chip" data-step="timeline">MateScript timeline</span>
          <span class="pipeline-arrow" aria-hidden="true">-&gt;</span>
          <span class="pipeline-chip" data-step="tts">MMS-TTS voice</span>
        </div>
      </div>
    </header>
    <main id="debug-app"></main>
    <script type="module" src="/src/debug.ts"></script>
  </body>
</html>
