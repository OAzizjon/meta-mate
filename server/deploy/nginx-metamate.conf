# nginx site for MetaMate: the landing page (site/) and the proxy (/v1/, /healthz).
# Replace DOMAIN; certbot adds the TLS lines (server/deploy/README.md).
server {
    listen 80;
    server_name DOMAIN;

    root /opt/metamate/site;
    index index.html;

    # Screenshots are at most 2 MB in base64 (policy.MAX_BODY_BYTES 2.5 MB).
    client_max_body_size 3m;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8787;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        # Streamed answers (SSE) and the speech socket: no buffering, long reads.
        proxy_buffering off;
        proxy_read_timeout 130s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# For the WebSocket upgrade above (/v1/asr); put it once in the http block if another site
# already defines it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
