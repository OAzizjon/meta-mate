<!doctype html>
<!-- Lesson card window (WP62): Muse Image recap card for older users.
     Shows an illustrated card with Mate, the lesson title, numbered steps and a
     line crediting the models (WP71), with Print and Close buttons. Sized for the
     640x720 window (WP78): the picture beside the title so the first steps show
     without scrolling, large steps, the buttons kept in view. Prints on one A4 or
     Letter page in black on white without the buttons. Supports dark mode, Windows
     contrast themes and reduced motion. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fffdf7;
        --panel-bg: #ffffff;
        --panel-border: #d0d8e5;
        --text: #1f2a44;
        --text-muted: #475569;
        --accent: #1d4ed8;
        --accent-soft: #eff6ff;
        --accent-hover: #1e40af;
        --accent-contrast: #ffffff;
        --badge-bg: #fef3c7;
        --badge-text: #92400e;
        --step-bg: #f8fafc;
        --step-border: #cbd5e1;
        --step-num-bg: #1d4ed8;
        --step-num-text: #ffffff;
        --btn-secondary-bg: #f1f5f9;
        --btn-secondary-border: #cbd5e1;
        --btn-secondary-text: #1f2a44;
        --btn-secondary-hover: #e2e8f0;
        --shadow: 0 4px 20px rgba(31, 42, 68, 0.09);
        --radius: 16px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131722;
          --panel-bg: #1c2230;
          --panel-border: #2e384d;
          --text: #f1f5f9;
          --text-muted: #cbd5e1;
          --accent: #ffd23f;
          --accent-soft: #252f42;
          --accent-hover: #facc15;
          --accent-contrast: #131722;
          --badge-bg: #422006;
          --badge-text: #fef08a;
          --step-bg: #22293a;
          --step-border: #3b4760;
          --step-num-bg: #ffd23f;
          --step-num-text: #131722;
          --btn-secondary-bg: #22293a;
          --btn-secondary-border: #3b4760;
          --btn-secondary-text: #f1f5f9;
          --btn-secondary-hover: #2d374d;
          --shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 20px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      /* A wider window than 640px keeps the lines short enough to follow. */
      #card-app {
        max-width: 820px;
        margin: 0 auto;
        padding: 16px;
      }

      .card-layout {
        display: flex;
        flex-direction: column;
        gap: 24px;
        background: var(--panel-bg);
        border: 2px solid var(--panel-border);
        border-radius: var(--radius);
        padding: 24px 24px 8px;
        box-shadow: var(--shadow);
      }

      /* The picture beside the badge and title, so the first steps show without scrolling. */
      .card-header {
        display: grid;
        grid-template-columns: clamp(150px, 34vw, 240px) minmax(0, 1fr);
        gap: 24px;
        align-items: center;
      }

      .card-media-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
      }

      /* Muse Image draws squares; `contain` letterboxes any other shape, never crops it. */
      .card-image-wrapper {
        width: 100%;
        max-width: 280px;
        aspect-ratio: 1 / 1;
        border-radius: 14px;
        overflow: hidden;
        background: var(--accent-soft);
        border: 2px solid var(--panel-border);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .card-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .card-placeholder-art {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, var(--accent-soft) 0%, var(--panel-bg) 75%);
      }

      .placeholder-bulb {
        max-width: 220px;
        max-height: 220px;
        filter: drop-shadow(0 4px 12px rgba(255, 210, 63, 0.35));
      }

      .card-heading {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        min-width: 0;
      }

      .card-badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 9999px;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.3;
        background: var(--badge-bg);
        color: var(--badge-text);
      }

      .card-title {
        margin: 0;
        font-size: 30px;
        font-weight: 700;
        line-height: 1.25;
        color: var(--text);
        overflow-wrap: break-word;
        text-wrap: balance;
      }

      @media (max-width: 480px) {
        #card-app {
          padding: 8px;
        }

        .card-layout {
          padding: 18px 18px 4px;
        }

        .card-header {
          grid-template-columns: minmax(0, 1fr);
          gap: 18px;
        }
      }

      .card-steps {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .card-step {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        background: var(--step-bg);
        border: 2px solid var(--step-border);
        border-radius: 12px;
        padding: 14px 18px 14px 14px;
      }

      .card-step-num {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--step-num-bg);
        color: var(--step-num-text);
        font-size: 22px;
        font-weight: 800;
        line-height: 1;
        flex-shrink: 0;
      }

      /* The top padding centres the first line (22px x 1.45) on the 44px number. */
      .card-step-text {
        min-width: 0;
        padding-top: 6px;
        font-size: 22px;
        font-weight: 500;
        line-height: 1.45;
        color: var(--text);
        overflow-wrap: break-word;
        text-wrap: pretty;
      }

      /* No display here: the [hidden] attribute hides the line. */
      .card-credits {
        margin: 0;
        font-size: 17px;
        line-height: 1.4;
        color: var(--text-muted);
      }

      /* Kept in view at the window's bottom while long steps scroll under it. */
      .card-actions {
        position: sticky;
        bottom: 0;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        padding: 16px 0;
        border-top: 2px solid var(--panel-border);
        background: var(--panel-bg);
      }

      .btn {
        flex: 1 1 180px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 56px;
        padding: 12px 28px;
        font-family: inherit;
        font-size: 21px;
        font-weight: 700;
        line-height: 1.2;
        border-radius: 12px;
        cursor: pointer;
        user-select: none;
        transition:
          background-color 140ms ease-out,
          border-color 140ms ease-out;
      }

      /* A press darkens the button but never shrinks it: a shaking hand stays on target. */
      .btn:active {
        filter: brightness(0.9);
      }

      .btn-primary {
        background: var(--accent);
        color: var(--accent-contrast);
        border: 2px solid var(--accent);
      }

      .btn-primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      .btn-secondary {
        background: var(--btn-secondary-bg);
        color: var(--btn-secondary-text);
        border: 2px solid var(--btn-secondary-border);
      }

      .btn-secondary:hover {
        background: var(--btn-secondary-hover);
      }

      .btn:focus-visible {
        outline: 4px solid var(--accent);
        outline-offset: 3px;
      }

      /* Windows contrast themes drop the backgrounds: the step numbers keep a ring. */
      @media (forced-colors: active) {
        .card-step-num {
          border: 2px solid CanvasText;
        }
      }

      .reduce-motion *,
      .reduce-motion *::before,
      .reduce-motion *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }

      @page {
        margin: 14mm;
      }

      /* One A4 or Letter page in black on white: the picture beside the title, the steps
         and the credit line, no buttons. Backgrounds are not printed by default, so the
         step numbers are rings, not discs, and the dark theme never reaches the paper. */
      @media print {
        :root {
          color-scheme: light;
          --bg: #ffffff;
          --panel-bg: #ffffff;
          --text: #000000;
          --text-muted: #000000;
          --accent-soft: #ffffff;
          --badge-bg: #ffffff;
          --badge-text: #000000;
          --step-bg: #ffffff;
          --step-border: #8a8a8a;
          --step-num-bg: #ffffff;
          --step-num-text: #000000;
        }

        #card-app {
          max-width: none;
          margin: 0;
          padding: 0;
        }

        .card-layout {
          gap: 6mm;
          padding: 0;
          border: none;
          border-radius: 0;
          box-shadow: none;
        }

        .card-header {
          grid-template-columns: 60mm minmax(0, 1fr);
          gap: 8mm;
          break-inside: avoid;
        }

        .card-image-wrapper {
          max-width: none;
          border: 1pt solid #8a8a8a;
          border-radius: 3mm;
        }

        .card-badge {
          padding: 0;
          font-size: 12pt;
        }

        .card-title {
          font-size: 24pt;
        }

        .card-steps {
          gap: 3mm;
        }

        .card-step {
          gap: 4mm;
          padding: 2.5mm 4mm 2.5mm 3mm;
          border-width: 1pt;
          border-radius: 3mm;
          break-inside: avoid;
        }

        .card-step-num {
          width: 9mm;
          height: 9mm;
          border: 1.5pt solid #000000;
          font-size: 14pt;
        }

        .card-step-text {
          padding-top: 2pt;
          font-size: 16pt;
          line-height: 1.35;
        }

        .card-credits {
          font-size: 11pt;
          break-inside: avoid;
        }

        .card-actions {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="card-app"></main>
    <script type="module" src="/src/card-page.ts"></script>
  </body>
</html>
