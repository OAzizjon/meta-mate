<!doctype html>
<!-- Lesson card window (WP62): comic-page keepsake recap for older users.
     Composes a 1200x1600 captioned comic keepsake on canvas (saved once via
     card_save_captioned) and displays it as a postcard: a dashed inner frame, the
     title on a yellow band, numbered circles before the speech-bubble steps, model
     credits (WP71), and Print / Close buttons. Uses src/theme.css
     tokens for light/dark themes, Windows contrast themes, and reduced motion.
     Prints the captioned keepsake page cleanly on one A4 or Letter sheet. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      :root {
        --panel-bg: var(--surface);
        --comic-ink: var(--panel-ink);
        --comic-shadow: #1f2a44;
        --halftone-dot: rgb(31 42 68 / 0.085);
        --badge-bg: var(--surface);
        --badge-text: var(--text);
        --step-bg: var(--surface-soft);
        --step-border: var(--comic-ink);
        --step-num-bg: var(--accent);
        --step-num-text: var(--on-accent);
        --band-bg: var(--accent);
        --band-text: var(--on-accent);
        --frame-line: var(--border-strong);
      }

      :root[data-theme="dark"] {
        --panel-bg: var(--surface);
        --comic-ink: var(--panel-ink);
        --comic-shadow: #090b10;
        --halftone-dot: rgb(255 210 63 / 0.085);
        --badge-bg: var(--surface);
        --badge-text: var(--text);
        --step-bg: var(--surface-soft);
        --step-border: var(--comic-ink);
        --step-num-bg: var(--accent);
        --step-num-text: var(--on-accent);
        --band-bg: var(--accent);
        --band-text: var(--on-accent);
        --frame-line: var(--border-strong);
      }

      html,
      body {
        min-height: 100%;
        font-size: var(--text-lg);
      }

      body {
        background-color: var(--bg);
        background-image: radial-gradient(
          circle,
          var(--halftone-dot) 1.35px,
          transparent 1.45px
        );
        background-size: 14px 14px;
      }

      /* A wider window than 640px keeps the lines short enough to follow. */
      #card-app {
        width: min(100%, 820px);
        margin: 0 auto;
        padding: var(--space-4);
      }

      /* A postcard: an inked card with a dashed frame just inside its edge. */
      .card-layout {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: var(--space-6);
        background: var(--panel-bg);
        border: var(--ink-width) solid var(--comic-ink);
        border-radius: var(--radius-lg);
        padding: clamp(20px, 3vw, 28px) clamp(18px, 3vw, 28px) var(--space-4);
        box-shadow: var(--ink-offset) var(--ink-offset) 0 var(--comic-shadow);
      }

      .card-layout::before {
        content: "";
        position: absolute;
        inset: 7px;
        border: 2px dashed var(--frame-line);
        border-radius: calc(var(--radius-lg) - 6px);
        pointer-events: none;
      }

      /* Keepsake preview beside the badge and title so the first steps show without scrolling. */
      .card-header {
        display: grid;
        grid-template-columns: clamp(145px, 32vw, 220px) minmax(0, 1fr);
        gap: var(--space-6);
        align-items: center;
      }

      .card-media-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
      }

      /* Matches the 1200x1600 (3:4) captioned comic keepsake without cropping. */
      .card-image-wrapper {
        width: 100%;
        max-width: 240px;
        aspect-ratio: 3 / 4;
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--accent-soft);
        border: var(--ink-width) solid var(--comic-ink);
        box-shadow: var(--ink-offset) var(--ink-offset) 0 var(--comic-shadow);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .card-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .card-placeholder-art {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, var(--accent-soft) 0%, var(--panel-bg) 78%);
      }

      .placeholder-bulb {
        width: 100%;
        max-width: 190px;
        max-height: 190px;
        filter: drop-shadow(0 4px 12px var(--glow));
      }

      /* The postcard's title band: the badge on paper, then the title on Mate's yellow. */
      .card-heading {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-3);
        min-width: 0;
        padding: var(--space-4) var(--space-5) var(--space-5);
        border: var(--ink-width) solid var(--comic-ink);
        border-radius: var(--radius);
        background: var(--band-bg);
        color: var(--band-text);
        box-shadow: var(--ink-offset) var(--ink-offset) 0 var(--comic-shadow);
      }

      .card-badge {
        max-width: 100%;
        display: inline-block;
        padding: 4px 14px;
        border-radius: var(--radius-sm);
        border: 2px solid var(--comic-ink);
        font-family: var(--font);
        font-size: var(--text-sm);
        font-weight: 700;
        line-height: 1.3;
        background: var(--badge-bg);
        color: var(--badge-text);
      }

      .card-title {
        margin: 0;
        font-family: var(--font-comic);
        font-size: var(--text-2xl);
        font-weight: 700;
        line-height: 1.25;
        color: var(--band-text);
        overflow-wrap: break-word;
        text-wrap: balance;
      }

      @media (max-width: 480px) {
        #card-app {
          padding: 8px;
        }

        .card-layout {
          padding: var(--space-5) var(--space-4) var(--space-4);
        }

        .card-header {
          grid-template-columns: minmax(0, 1fr);
          gap: var(--space-5);
        }
      }

      .card-steps {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .card-step {
        display: flex;
        align-items: flex-start;
        gap: clamp(12px, 2.5vw, 18px);
      }

      /* Each step's number in a yellow coin, like the keepsake's. */
      .card-step-num {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        margin-top: 2px;
        border-radius: 50%;
        border: var(--ink-width) solid var(--comic-ink);
        box-shadow: var(--ink-offset-sm) var(--ink-offset-sm) 0 var(--comic-shadow);
        background: var(--step-num-bg);
        color: var(--step-num-text);
        font-family: var(--font);
        font-size: clamp(20px, 3vw, 22px);
        font-weight: 800;
        line-height: 1;
        flex-shrink: 0;
      }

      /* Comic speech bubble with a left tail pointing at the step number badge. */
      .card-step-text {
        flex: 1;
        min-width: 0;
        position: relative;
        background: var(--step-bg);
        border: var(--ink-width) solid var(--step-border);
        border-radius: var(--radius);
        box-shadow: var(--ink-offset) var(--ink-offset) 0 var(--comic-shadow);
        padding: 12px clamp(12px, 2.5vw, 18px);
        font-size: clamp(20px, 3vw, 22px);
        font-weight: 600;
        line-height: 1.42;
        color: var(--text);
        overflow-wrap: break-word;
        text-wrap: pretty;
      }

      .card-step-text::before,
      .card-step-text::after {
        content: "";
        position: absolute;
        width: 0;
        height: 0;
        border-style: solid;
        pointer-events: none;
      }

      .card-step-text::before {
        top: 13px;
        left: -13px;
        border-width: 9px 13px 9px 0;
        border-color: transparent var(--step-border) transparent transparent;
      }

      .card-step-text::after {
        top: 15px;
        left: -9px;
        border-width: 7px 10px 7px 0;
        border-color: transparent var(--step-bg) transparent transparent;
      }

      /* No display here: the [hidden] attribute hides the line. */
      .card-credits {
        margin: 0;
        font-size: var(--text-sm);
        line-height: 1.4;
        color: var(--text-muted);
      }

      /* The family's note in the keepsake's handwritten face. No display here either. */
      .card-family-note {
        margin: 0;
        padding: 12px clamp(12px, 2.5vw, 18px);
        border: 2.5px dashed var(--comic-ink);
        border-radius: var(--radius);
        background: var(--accent-soft);
        font-family: "Segoe Print", var(--font);
        font-size: clamp(20px, 3vw, 22px);
        font-weight: 700;
        line-height: 1.5;
        text-align: center;
        color: var(--text);
        overflow-wrap: break-word;
      }

      /* Kept in view at the window's bottom while long steps scroll under it. */
      .card-actions {
        position: sticky;
        bottom: 0;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-4);
        padding: var(--space-4) 0;
        border-top: var(--ink-width) solid var(--comic-ink);
        background: var(--panel-bg);
      }

      .card-actions .btn {
        flex: 1 1 180px;
        min-height: 56px;
        padding: 12px clamp(12px, 3vw, 28px);
        font-size: 21px;
        font-weight: 700;
      }

      /* Windows contrast themes drop fills and decorative tails while keeping solid outlines. */
      @media (forced-colors: active) {
        body {
          background-image: none;
        }

        .card-layout,
        .card-image-wrapper,
        .card-heading,
        .card-badge,
        .card-step-num,
        .card-step-text,
        .card-actions .btn {
          box-shadow: none;
          border: 2px solid CanvasText;
        }

        .card-layout::before {
          border-color: CanvasText;
        }

        .card-step-text::before,
        .card-step-text::after {
          display: none;
        }
      }

      @page {
        margin: 12mm;
      }

      /* Prints the captioned keepsake page on one A4 or Letter sheet in black on white,
         without buttons, and keeps a crisp black-on-white fallback when uncaptioned. */
      @media print {
        :root,
        :root[data-theme="dark"] {
          color-scheme: light;
          --bg: #ffffff;
          --panel-bg: #ffffff;
          --text: #000000;
          --text-muted: #000000;
          --accent-soft: #ffffff;
          --badge-bg: #ffffff;
          --badge-text: #000000;
          --step-bg: #ffffff;
          --step-border: #000000;
          --step-num-bg: #ffffff;
          --step-num-text: #000000;
          --band-bg: #ffffff;
          --band-text: #000000;
          --comic-ink: #000000;
          --comic-shadow: transparent;
        }

        html,
        body {
          background: #ffffff;
          background-image: none;
        }

        #card-app {
          width: auto;
          max-width: none;
          margin: 0;
          padding: 0;
        }

        .card-layout {
          gap: 5mm;
          padding: 0;
          border: none;
          border-radius: 0;
          box-shadow: none;
        }

        .card-layout::before {
          display: none;
        }

        .card-heading {
          padding: 0;
          border: none;
        }

        .card-layout.has-captioned .card-header {
          display: block;
        }

        .card-layout.has-captioned .card-heading,
        .card-layout.has-captioned .card-steps,
        .card-layout.has-captioned .card-family-note {
          display: none;
        }

        .card-layout.has-captioned .card-image-wrapper {
          width: auto;
          max-width: none;
          aspect-ratio: auto;
          border: none;
          border-radius: 0;
          box-shadow: none;
          background: transparent;
        }

        .card-layout.has-captioned .card-image {
          width: auto;
          height: auto;
          max-width: 100%;
          max-height: 238mm;
          margin: 0 auto;
        }

        .card-header {
          grid-template-columns: 56mm minmax(0, 1fr);
          gap: 8mm;
          break-inside: avoid;
        }

        .card-image-wrapper {
          max-width: none;
          border: 1.5pt solid #000000;
          border-radius: 3mm;
          box-shadow: none;
        }

        .card-badge {
          padding: 1mm 3mm;
          font-size: 11pt;
          box-shadow: none;
        }

        .card-title {
          font-size: 24pt;
        }

        .card-steps {
          gap: 3mm;
        }

        .card-step {
          gap: 4mm;
          break-inside: avoid;
        }

        .card-step-num {
          width: 9mm;
          height: 9mm;
          border: 1.5pt solid #000000;
          box-shadow: none;
          font-size: 14pt;
        }

        .card-step-text {
          padding: 2.5mm 4mm;
          border-width: 1pt;
          border-radius: 3mm;
          box-shadow: none;
          font-size: 15pt;
          line-height: 1.35;
        }

        .card-step-text::before,
        .card-step-text::after {
          display: none;
        }

        .card-credits {
          font-size: 10pt;
          text-align: center;
          break-inside: avoid;
        }

        .card-family-note {
          padding: 2.5mm 4mm;
          border-width: 1pt;
          border-radius: 3mm;
          background: #ffffff;
          font-size: 15pt;
          break-inside: avoid;
        }

        .card-actions {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="card-app"></main>
    <script type="module" src="/src/card-page.ts"></script>
  </body>
</html>
